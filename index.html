<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ใบงานตรวจสอบบำรุงรักษา · MEA Asset Inspection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;600;700&display=swap">
<style id="css">
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --desk:#d9dee2;--chrome:#12202f;--chrome-ink:#eef2f6;--chrome-dim:#9db0c2;
  --card:#ffffff;--ink:#14202e;--ink2:#52606d;--line:#bcc6cf;--hair:#e4e9ed;
  --accent:#e4570b;--accent-ink:#ffffff;--ok:#17734a;--bad:#b42318;--warn:#8f5a00;
  --f-ui:"IBM Plex Sans Thai","Noto Sans Thai","Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-paper:"Sarabun","Noto Sans Thai","IBM Plex Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#151b22;--chrome:#0a1118;--card:#212b35;--ink:#e9eef3;--ink2:#a6b2be;--line:#3b4753;--hair:#2c3640;--accent:#ff7a30;--ok:#4cc38a;--bad:#ff7b6e;--warn:#e7b04a;}}
:root[data-theme="dark"]{
  --desk:#151b22;--chrome:#0a1118;--card:#212b35;--ink:#e9eef3;--ink2:#a6b2be;--line:#3b4753;--hair:#2c3640;--accent:#ff7a30;--ok:#4cc38a;--bad:#ff7b6e;--warn:#e7b04a;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--desk);color:var(--ink);font:15px/1.55 var(--f-ui)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.muted{color:var(--ink2)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--chrome);color:var(--chrome-ink)}
.bar .wrap{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:0 12px}
.brand{font-weight:700;font-size:17px;padding:9px 0;white-space:nowrap;line-height:1.2}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--chrome-dim)}
.tabs{display:flex;overflow-x:auto;margin-left:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--chrome-dim);padding:15px 12px 11px;cursor:pointer;white-space:nowrap}
.tab[aria-current="page"]{color:#fff;border-bottom-color:var(--accent);font-weight:600}
.tab:focus-visible,.btn:focus-visible,.opt:focus-visible,.wor:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:1000px;margin:0 auto;padding:16px 12px 110px}
.page-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:6px 0 12px}
.page-h h1{font-size:22px}
.tool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.tool.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 46px);z-index:15;background:var(--desk);padding:8px 0;margin-top:-8px}
.tool .sp{flex:1}
.btn{border:1.5px solid var(--ink);background:transparent;padding:8px 14px;border-radius:6px;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;line-height:1.2;font-weight:500;color:var(--ink)}
.btn:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 10px;min-height:32px;font-size:13.5px}
.btn.quiet{border-color:var(--line);color:var(--ink2)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:4px 13px;cursor:pointer;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--desk)}
.search{flex:1;min-width:150px;border:1.5px solid var(--line);background:var(--card);border-radius:6px;padding:8px 10px;min-height:40px}
.ledger{background:var(--card);border:1px solid var(--line);border-radius:4px}
.ledger .empty{padding:28px 16px;text-align:center;color:var(--ink2)}
.wor{display:grid;grid-template-columns:30px 1fr auto;gap:2px 10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--hair);cursor:pointer}
.wor:last-child{border-bottom:0}
.wor:hover{background:color-mix(in srgb,var(--accent) 6%,var(--card))}
.wor input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.wno{font-weight:600;font-variant-numeric:tabular-nums}
.tag{font-size:12px;border:1px solid var(--line);padding:0 6px;border-radius:3px;color:var(--ink2);margin-left:6px;font-weight:500}
.sub{font-size:13.5px;color:var(--ink2)}
.late{color:var(--bad);font-weight:600}
.stamp{display:inline-block;border:2px solid currentColor;outline:1px solid currentColor;outline-offset:2px;border-radius:4px;padding:0 9px;font-weight:700;font-size:13px;transform:rotate(-3deg);white-space:nowrap;margin:3px}
.s-open{color:var(--ink2)}.s-progress{color:var(--warn)}.s-done{color:var(--ok)}.s-late{color:var(--bad)}
.navset{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center}
.row2{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--chrome);color:var(--chrome-ink);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:none}
.selbar.on{display:block}
.selbar .in{max-width:1000px;margin:0 auto;display:flex;gap:10px;align-items:center}
.selbar .btn{border-color:var(--chrome-ink);color:var(--chrome-ink)}
.selbar .btn.pri{border-color:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin-bottom:8px}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 12px}
.formgrid .full{grid-column:1/-1}
.fl{display:block;font-size:13px;color:var(--ink2);margin-bottom:2px}
.txt,.card select,.card textarea{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:6px;padding:8px 10px;min-height:40px}
.txt:focus,.card select:focus,.card textarea:focus,.search:focus{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);border-color:var(--accent)}
.route .stop{display:grid;grid-template-columns:34px 1fr;gap:4px 10px;padding:12px;border-bottom:1px solid var(--hair);background:var(--card)}
.route .stop.next{box-shadow:inset 4px 0 0 var(--accent)}
.route .stop.arrived{opacity:.6}
.seq{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--desk);display:grid;place-items:center;font-weight:700;font-size:14px}
.route .stop.next .seq{background:var(--accent);color:#fff}
.leg{grid-column:2;font-size:13px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--desk);padding:10px 16px;border-radius:8px;z-index:60;max-width:90vw;font-size:14px;display:none}
.toast.on{display:block}
.modal{position:fixed;inset:0;background:rgba(10,17,24,.55);z-index:70;display:grid;place-items:center;padding:16px}
.modal .box2{background:var(--card);border-radius:8px;padding:18px;max-width:420px;width:100%}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.warnbar{background:color-mix(in srgb,var(--warn) 18%,var(--card));border:1px solid var(--warn);border-radius:4px;padding:8px 12px;margin-bottom:12px;font-size:14px}
.formlist .ledger .wor{grid-template-columns:1fr auto;cursor:default}
.code{font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- paper ---------- */
.sheet{--p-ink:#14202e;--p-rule:#7d8994;--p-head:#dfe3e7;--p-dim:#5b6773;--paper:#ffffff;--p-accent:#c24a08;
  position:relative;background:var(--paper);color:var(--p-ink);font-family:var(--f-paper);font-size:14px;line-height:1.45;max-width:794px;margin:0 auto 18px;padding:22px 22px 20px;box-shadow:0 1px 0 rgba(0,0,0,.08),0 10px 28px rgba(10,20,30,.16);border-radius:2px}
.sheet h1{font-size:21px;line-height:1.2}
.sheet h2{font-size:16.5px;text-align:center;margin:0 0 10px}
.dochead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:12px}
.dochead .org{font-size:13px;color:var(--p-dim)}
.sheet .sub2{font-size:13px;color:var(--p-dim)}
.metat{border-collapse:collapse;font-size:13px}
.metat th,.metat td{border:1px solid var(--p-rule);padding:2px 8px;text-align:left}
.metat th{background:var(--p-head);font-weight:600}
.sheet .stamp{position:absolute;right:24px;top:92px;font-size:22px;padding:2px 14px;transform:rotate(-8deg);opacity:.85;pointer-events:none;z-index:2}
.secbar{display:flex;gap:10px;background:var(--p-head);border:1px solid var(--p-rule);font-weight:700;padding:3px 8px;margin-top:10px;margin-bottom:-1px}
.secbar .n{min-width:14px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);margin-left:1px}
.f{display:flex;align-items:stretch;border:1px solid var(--p-rule);margin:0 0 -1px -1px;min-width:0}
.f .l{background:var(--p-head);padding:3px 8px;font-weight:600;flex:0 0 auto;display:flex;align-items:center;max-width:55%}
.f .c{flex:1;min-width:0;padding:1px 6px;display:flex;align-items:center;flex-wrap:wrap;gap:2px 10px}
.f .u{padding:0 8px;color:var(--p-dim);display:flex;align-items:center}
.in{width:100%;border:0;border-bottom:1px dotted var(--p-rule);background:color-mix(in srgb,#e4570b 6%,transparent);color:var(--p-ink);padding:5px 3px;min-height:30px;border-radius:0;font-family:inherit;font-size:inherit}
.in:focus{outline:2px solid #e4570b;outline-offset:-1px;background:#fff8ef}
.in.out{color:#b42318;font-weight:700;background:#fdeceb}
select.in{padding:4px 2px}
.v{display:inline-block;min-width:3em;border-bottom:1px dotted var(--p-rule);padding:0 2px;white-space:pre-wrap}
.f .c .v{flex:1}
.ta{width:100%;display:block;border:1px solid var(--p-rule);background:color-mix(in srgb,#e4570b 5%,transparent);color:var(--p-ink);padding:5px 8px;min-height:64px;resize:none;overflow:hidden;font-family:inherit;font-size:inherit;border-radius:0;margin-top:-1px}
.ta:focus{outline:2px solid #e4570b;outline-offset:-1px;background:#fff8ef}
.opt{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:4px 2px;cursor:pointer;color:var(--p-ink);min-height:30px;font-family:inherit;font-size:inherit}
.opt:disabled{cursor:default;opacity:1;color:inherit}
.box{display:inline-block;width:19px;height:19px;border:1.6px solid var(--p-ink);background:#fff;position:relative;flex:0 0 auto}
.opt[aria-pressed="true"] .box::after{content:"✓";position:absolute;inset:-4px 0 0 2px;font-size:20px;line-height:1;font-weight:700}
.opt[data-v="bad"][aria-pressed="true"] .box{border-color:#b42318;color:#b42318}
.scrollx{overflow-x:auto}
table.chk{width:100%;border-collapse:collapse;font-size:13.5px}
table.chk th,table.chk td{border:1px solid var(--p-rule);padding:2px 6px;vertical-align:middle}
table.chk th{background:var(--p-head);font-weight:600;text-align:center}
table.chk td.no{width:38px;text-align:center;color:var(--p-dim);white-space:nowrap}
table.chk td.lb{text-align:left}
table.chk td.bx,table.chk th.bx{width:52px;text-align:center;padding:0}
table.chk td.bx.dim{background:repeating-linear-gradient(135deg,transparent 0 5px,#0001 5px 6px)}
table.chk td.crit{width:24%;font-size:12.5px;color:var(--p-dim)}
table.chk td.df{min-width:110px;padding:0 3px}
table.chk td.df .in{border-bottom:0;background:transparent}
table.chk tr.grp td{font-weight:700;text-decoration:underline;background:#f3f5f7;padding:3px 8px}
table.chk td.calc{text-align:center;font-weight:600;min-width:64px}
table.chk td.calc.out,.calc.out{color:#b42318}
table.chk .in{text-align:center}
table.chk td.lb .in{text-align:left}
.ex{display:inline-flex;align-items:center;gap:6px;margin-left:8px;font-size:13px;color:var(--p-dim)}
.ex .in{width:110px}
.mt{font-weight:600;margin:8px 0 3px}
.gpsrow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.gpsrow .btn{color:#14202e;border-color:#14202e}
.gpsrow .btn.pri{color:#fff;border-color:var(--accent)}
.signs{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:12px;border:1px solid var(--p-rule)}
.sg{padding:6px 10px}
.sg+.sg{border-left:1px solid var(--p-rule)}
.sgl{font-weight:700;margin-bottom:2px}
.f2{display:flex;align-items:center;gap:6px}
.f2>span{flex:0 0 auto;color:var(--p-dim);font-size:13px;width:3.6em}
.ff{display:flex;justify-content:space-between;margin-top:16px;font-size:12px;color:var(--p-dim)}
.fh{position:relative}
.wref{font-size:12px;color:var(--p-dim);text-align:right;margin-bottom:2px}
.bvnote{font-size:12.5px;color:var(--p-dim);margin:3px 0}
.verdict{font-weight:700;min-height:1.4em}
.verdict.ok{color:#17734a}.verdict.bad{color:#b42318}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:6px 0}
.photos figure{margin:0;position:relative;border:1px solid var(--p-rule);background:#fafafa}
.photos img{display:block;width:100%;height:auto;min-height:60px}
.photos figcaption{font-size:11px;color:var(--p-dim);padding:2px 4px}
.photos .x{position:absolute;top:2px;right:2px;width:26px;height:26px;border-radius:50%;border:0;background:#000a;color:#fff;cursor:pointer;font-size:16px;line-height:1}
.photos .empty{color:var(--p-dim);font-size:13px;padding:6px 0}
.prow{display:flex;gap:6px;flex-wrap:wrap}
.prow .btn{color:#14202e;border-color:#14202e;cursor:pointer}
.pl{font-weight:600;margin-top:8px}
.kvt{width:100%;border-collapse:collapse;font-size:14px}
.kvt th,.kvt td{border:1px solid var(--p-rule);padding:3px 8px;text-align:left;vertical-align:middle}
.kvt th{background:var(--p-head);width:22%;font-weight:600}
.kvt td .in{width:100%}
.prog{font-size:13px;color:var(--p-dim);margin:6px 0}
.printonly{display:none}
@media (max-width:600px){
  .brand small{display:none}
  .formgrid{grid-template-columns:1fr}
  .sheet{padding:14px 10px}
  .grid .f{grid-column:span 12!important}
  .grid .f.w2,.grid .f.w3,.grid .f.w4{grid-column:span 6!important}
  .signs{grid-template-columns:1fr}.sg+.sg{border-left:0;border-top:1px solid var(--p-rule)}
  .wor{grid-template-columns:30px 1fr}
  .wor .end{grid-column:2}
  .sheet .stamp{top:70px;font-size:17px}
  .dochead{flex-direction:column}
}
@media print{
  @page{size:A4;margin:9mm}
  html,body{background:#fff!important;padding:0!important;color:#000}
  .noprint,.bar,.toast,.selbar,.modal{display:none!important}
  main{padding:0!important;max-width:none!important}
  .sheet{box-shadow:none!important;max-width:none!important;margin:0!important;padding:0!important;font-size:11.5px;border-radius:0}
  .printonly{display:block}
  .pb{break-before:page}
  .scrollx{overflow:visible}
  .in{border-bottom:1px dotted #444!important;background:none!important}
  select.in{-webkit-appearance:none;appearance:none}
  .ta{overflow:visible;background:none!important}
  tr,figure,.signs{break-inside:avoid}
  .sheet .stamp{opacity:.7}
}

/* ===== ใบงานแบบต้นฉบับ (override) ===== */
.sheet{--p-ink:#000;--p-rule:#000;--p-head:#d9d9d9;--p-dim:#333;font-family:"Sarabun","TH Sarabun New","Noto Sans Thai",sans-serif;font-size:14px;line-height:1.35;padding:28px 26px 18px;border-radius:0}
.sheet h2{font-size:18px;font-weight:700;margin:4px 0 16px}
.wref{color:#555}
.sheet .grid{margin-left:0}
.sx{display:grid;grid-template-columns:30px 1fr;border:1px solid #000;margin-top:-1px}
.sx:first-of-type{margin-top:0}
.sn{border-right:1px solid #000;text-align:center;font-weight:600;padding-top:3px}
.sb{min-width:0}
.sb .grid{margin:0 -1px -1px 0}
.sb .grid .f:first-child,.sb>.grid .f{margin-left:-1px}
.sheet .secbar{display:block;background:var(--p-head);border:0;border-bottom:1px solid #000;margin:0;padding:2px 8px;font-weight:700}
.sheet .secbar u{text-underline-offset:2px}
.sb>.secbar+*{margin-top:0}
.sheet .f{border-color:#000}
.sheet .f .l{background:none;font-weight:400;padding:2px 6px;border-right:1px solid #000;white-space:nowrap}
.sheet .f .u{color:#000}
.sheet .in{border:0;background:transparent;min-height:26px;padding:3px 4px;color:#000}
.sheet .in:hover{background:#fff7e8}
.sheet .in:focus{outline:2px solid #e4570b;outline-offset:-2px;background:#fff7e8}
.sheet .in.out{background:#fdeceb;color:#b42318}
.sheet .ex .in{border-bottom:1px dotted #000;width:120px}
.sheet .v{border-bottom:0}
.sheet .ta{border:0;border-top:1px solid #000;background:repeating-linear-gradient(transparent 0 25px,#000 25px 26px);line-height:26px;padding:0 8px;min-height:53px;margin:0}
.sheet .ta:focus{outline:2px solid #e4570b;outline-offset:-2px}
.sheet table.chk{font-size:13.5px;border-style:hidden}
.sheet table.chk th,.sheet table.chk td{border:1px solid #000}
.sheet table.chk th{background:none;font-weight:400;padding:1px 4px}
.sheet table.chk th.hl{width:auto}
.sheet table.chk th.hd{width:30%}
.sheet table.chk td.lb{padding:2px 6px}
.sheet table.chk .rn{display:inline-block;min-width:2.2em;margin-right:4px}
.sheet table.chk td.bx,.sheet table.chk th.bx{width:46px}
.sheet table.chk td.bx.dim{background:none}
.sheet table.chk tr.grp td{background:none;text-decoration:none;font-weight:400;padding:2px 6px}
.sheet table.chk td.crit{color:#000}
.sheet table.chk td.c{text-align:center}
.sheet table.chk .in{text-align:center}
.sheet table.chk td.lb .in,.sheet table.chk td.df .in{text-align:left}
.sheet .box{width:14px;height:14px;border:1.4px solid #000}
.sheet .opt[aria-pressed="true"] .box::after{inset:-6px 0 0 1px;font-size:17px}
.sheet .opt[data-v="bad"][aria-pressed="true"] .box{border-color:#000;color:#b42318}
.st{padding:2px 8px;font-weight:700;border-bottom:1px solid #000}
.sheet table.bv td.bvnote{font-size:12.5px;color:#000;padding:2px 6px;line-height:1.6}
.ybar{background:#ffff00;border:1px solid #000;margin-top:-1px;text-align:center;font-weight:700;padding:1px}
.sheet .mt{font-weight:400;margin:0;padding:2px 6px;border-bottom:1px solid #000;border-top:1px solid #000;margin-top:-1px}
.sheet .photos{padding:6px}
.sheet .pl{font-weight:400;padding:2px 6px}
.sheet .prow{padding:0 6px 6px}
.sheet .gpsrow{padding:4px 6px;margin:0;border-top:1px solid #000}
.sheet .photos .empty{padding:4px 6px}
.sgt{width:100%;border-collapse:collapse;border:1px solid #000;margin-top:-1px}
.sgt th,.sgt td{border:1px solid #000;padding:0 6px;height:26px}
.sgt th{font-weight:400;text-align:left;width:12%;white-space:nowrap}
.sgt td{width:38%}
.sheet .ff{margin-top:26px;color:#000;font-size:12px;padding:0 16px}
.sheet .kvt th,.sheet .kvt td{border-color:#000}
.sheet .kvt th{background:none;font-weight:400}
.sheet .metat th,.sheet .metat td{border-color:#000}
.sheet .metat th{background:none;font-weight:400}
.sheet .signs,.sheet .sg+.sg{border-color:#000}
.sheet .verdict{font-size:12.5px}
@media (max-width:600px){
  .sheet{padding:16px 8px 12px;font-size:13px}
  .sx{grid-template-columns:22px 1fr}
  .sheet .f .l{white-space:normal}
}
@media print{
  .sheet{font-size:11.5px;padding:0!important}
  .sheet .in,.sheet .ta{background:none!important}
  .sheet .ta{background:repeating-linear-gradient(transparent 0 21px,#000 21px 22px)!important;line-height:22px;-webkit-print-color-adjust:exact;print-color-adjust:exact}

<script>

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=(n,l=2)=>String(n).padStart(l,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const nowLocal=()=>{const d=new Date();return `${today()}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fmtD=iso=>{if(!iso)return'';const [y,m,d]=String(iso).slice(0,10).split('-');return y&&m&&d?`${d}/${m}/${+y+543}`:''};
const fmtDT=s=>s?`${fmtD(s)} ${String(s).slice(11,16)}`:'';
const addMonths=(iso,n)=>{const d=new Date((iso||today())+'T00:00:00');d.setMonth(d.getMonth()+n);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const num=v=>{const n=parseFloat(v);return Number.isFinite(n)?n:null};
const coord=s=>{if(!s)return null;const la=num(s.lat),ln=num(s.lng);return la!==null&&ln!==null?{lat:la,lng:ln}:null};
const hav=(a,b)=>{const r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 12742*Math.asin(Math.sqrt(h))};
const fmtKm=km=>km<1?`${Math.round(km*1000)} ม.`:`${km.toFixed(km<10?1:0)} กม.`;
const ck=no=>'c'+no.replace('.','_');
const TYPES={PM:'PM',CM:'CM',INS:'INS'};
const TYPE_TXT={PM:'บำรุงรักษาตามแผน (PM)',CM:'ซ่อมแก้ไข (CM)',INS:'ตรวจสอบ (INS)'};

/* ===== Storage (IndexedDB → localStorage → memory) ===== */
const Store=(()=>{
  let db=null,mode='mem';const mem={photos:new Map()};
  const open=()=>new Promise(res=>{try{const r=indexedDB.open('asset-inspection',1);
    r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('photos')};
    r.onsuccess=()=>{db=r.result;mode='idb';res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}});
  const tx=(store,m,fn)=>new Promise((res,rej)=>{try{const t=db.transaction(store,m);const rq=fn(t.objectStore(store));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}catch(e){rej(e)}});
  return{
    async init(){if(!(await open())){try{localStorage.setItem('_t','1');localStorage.removeItem('_t');mode='ls'}catch(e){mode='mem'}}return mode},
    get mode(){return mode},
    async loadState(){try{if(mode==='idb')return await tx('kv','readonly',s=>s.get('state'));if(mode==='ls'){const t=localStorage.getItem('ai_state');return t?JSON.parse(t):null}}catch(e){}return null},
    async saveState(st){try{if(mode==='idb')return await tx('kv','readwrite',s=>s.put(st,'state'));if(mode==='ls')localStorage.setItem('ai_state',JSON.stringify(st))}catch(e){}},
    async getPhoto(id){try{if(mode==='idb')return await tx('photos','readonly',s=>s.get(id))}catch(e){}return mem.photos.get(id)||null},
    async putPhoto(id,v){mem.photos.set(id,v);try{if(mode==='idb')await tx('photos','readwrite',s=>s.put(v,id))}catch(e){}},
    async delPhoto(id){mem.photos.delete(id);try{if(mode==='idb')await tx('photos','readwrite',s=>s.delete(id))}catch(e){}},
    async wipe(){mem.photos.clear();try{if(mode==='idb'){await tx('kv','readwrite',s=>s.clear());await tx('photos','readwrite',s=>s.clear())}if(mode==='ls')localStorage.removeItem('ai_state')}catch(e){}}
  };
})();

/* ===== Geo ===== */
function locate(maxAge=30000,timeout=8000){
  return new Promise(res=>{
    if(me&&Date.now()-me.at<maxAge)return res(me);
    if(!navigator.geolocation)return res(null);
    try{navigator.geolocation.getCurrentPosition(p=>{me={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,at:Date.now()};res(me)},()=>res(null),{enableHighAccuracy:true,timeout,maximumAge:maxAge})}catch(e){res(null)}
  });
}
const gU=(la,ln)=>`https://www.google.com/maps/dir/?api=1&destination=${la},${ln}&travelmode=driving`;
const aU=(la,ln)=>`https://maps.apple.com/?daddr=${la},${ln}&dirflg=d`;

}

const distTo=s=>{const c=coord(s);return me&&c?hav(me,c):null};

/* ===== Photos ===== */
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=rej;i.src=u})}
async function makePhoto(file){
  const posP=locate(120000,4000);
  const img=await loadImg(file);const max=1100;const s=Math.min(1,max/Math.max(img.width,img.height));
  const w=Math.round(img.width*s),h=Math.round(img.height*s);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
  const pos=await posP;const ts=nowLocal();
  const cap=`${fmtDT(ts)}${pos?`  ${pos.lat.toFixed(5)}, ${pos.lng.toFixed(5)}`:''}`;
  const fs=Math.max(13,Math.round(w/44));x.font=`${fs}px sans-serif`;
  x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,h-fs*1.9,w,fs*1.9);x.fillStyle='#fff';x.textBaseline='middle';x.fillText(cap,fs*.6,h-fs*.95);
  return{data:c.toDataURL('image/jpeg',.72),ts,lat:pos?pos.lat:null,lng:pos?pos.lng:null,cap};
}
const photoInner=(ids,ro)=>ids.length?ids.map(id=>`<figure><img data-pid="${id}" alt="ภาพถ่าย"><figcaption data-cap="${id}"></figcaption>${ro?'':`<button type="button" class="x noprint" data-act="delph" data-id="${id}" aria-label="ลบภาพ">×</button>`}</figure>`).join(''):`<div class="empty noprint">ยังไม่มีภาพ</div>`;
async function hydrate(root=document){
  for(const img of $$('img[data-pid]',root)){
    if(img.getAttribute('src'))continue;
    const p=await Store.getPhoto(img.dataset.pid);
    if(p){img.src=p.data;const cp=img.parentElement.querySelector('figcaption');if(cp)cp.textContent=p.cap||''}
  }
}

/* ===== Sheet renderers ===== */
function inp(k,d,ro,o={}){
  const v=d[k]??'';
  if(ro){let s=v;if(o.t==='date')s=fmtD(v);if(o.t==='dt')s=fmtDT(v);return `<span class="v">${esc(s)}</span>`}
  const type=o.t==='date'?'date':o.t==='time'?'time':o.t==='dt'?'datetime-local':'text';
  return `<input class="in" type="${type}" data-d="${k}" value="${esc(v)}"${o.t==='num'?' inputmode="decimal"':''}${o.rng?` data-rng="${o.rng}"`:''} autocomplete="off">`;
}
const selx=(k,opts,d,ro)=>ro?`<span class="v">${esc(d[k]||'')}</span>`:`<select class="in" data-d="${k}"><option value=""></option>${opts.map(o=>`<option${d[k]===o?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
const radio=(k,opts,d,ro)=>opts.map(o=>`<button type="button" class="opt" data-act="rad" data-k="${k}" data-v="${esc(o)}" aria-pressed="${d[k]===o}"${ro?' disabled':''}><i class="box"></i>${esc(o)}</button>`).join('');
function bFld(b,d,ro){
  const cells=b.f.map(f=>{
    const c=f.t==='rad'?radio(f.k,f.opts,d,ro):inp(f.k,d,ro,f);
    return `<div class="f w${f.w||4}"><span class="l">${esc(f.l)}</span><span class="c">${c}</span></div>`;
  }).join('');
  const gps=b.gps&&!ro?`<div class="noprint gpsrow"><button type="button" class="btn sm" data-act="gpsfill">ใช้พิกัดปัจจุบัน</button>${navBtnsD()}</div>`:'';
  return `<div class="grid">${cells}</div>${gps}`;
}
function bChk(b,d,ro){
  const cols=b.cols,span=2+(b.crit?1:0)+cols.length+(b.act?1:0);
  const head=`<thead><tr><th rowspan="2" class="hl">รายการ</th>${b.crit?'<th rowspan="2">เกณฑ์</th>':''}<th colspan="${cols.length}">ผลการตรวจสอบ</th><th rowspan="2" class="hd">ข้อบกพร่อง</th>${b.act?'<th rowspan="2">การดำเนินการแก้ไข/เพิ่มเติม</th>':''}</tr><tr>${cols.map(c=>`<th class="bx">${c.l}</th>`).join('')}</tr></thead>`;
  const body=b.rows.map(r=>{
    if(r.grp)return `<tr class="grp"><td colspan="${span}"><u>${esc(r.grp)}</u></td></tr>`;
    const k=ck(r.no),allowed=r.opts||cols.map(c=>c.v);
    const cells=cols.map(c=>allowed.includes(c.v)?`<td class="bx"><button type="button" class="opt" data-act="pick" data-k="${k}" data-v="${c.v}" aria-pressed="${d[k]===c.v}" aria-label="${esc(r.l)} ${c.l}"${ro?' disabled':''}><i class="box"></i></button></td>`:'<td class="bx dim"></td>').join('');
    const ex=r.extra?` <span class="ex">${esc(r.extra.l)} ${inp(r.extra.k,d,ro,r.extra)}</span>`:'';
    return `<tr><td class="lb"><span class="rn">${r.no}</span>${esc(r.l)}${ex}</td>${b.crit?`<td class="crit">${esc(r.crit||'')}</td>`:''}${cells}<td class="df">${inp(k+'_n',d,ro)}</td>${b.act?`<td class="df">${inp(k+'_a',d,ro)}</td>`:''}</tr>`;
  }).join('');
  return `<div class="scrollx"><table class="chk">${head}<tbody>${body}</tbody></table></div>`;
}
function bMeas(b,d,ro){
  const w=12/b.cols;
  return `${b.title?`<div class="mt">${esc(b.title)}</div>`:''}<div class="grid">${b.cells.map(c=>`<div class="f w${w}"><span class="l">${esc(c.l)}</span><span class="c">${inp(c.k,d,ro,{t:'num',rng:c.rng?c.rng.join(','):''})}</span></div>`).join('')}</div>`;
}
function bTbl(b,d,ro){
  const head=`<tr><th>${esc(b.head||'')}</th>${b.cols.map(c=>`<th>${esc(c.l)}</th>`).join('')}</tr>`;
  const rows=b.rows.map((r,i)=>`<tr><td class="lb">${esc(r.l)}</td>${b.cols.map(c=>{const k=`${b.key}${i}_${c.k}`;return `<td>${c.t==='sel'?selx(k,c.opts,d,ro):inp(k,d,ro,{t:c.num?'num':'',rng:c.num&&r.rng?r.rng.join(','):''})}</td>`}).join('')}</tr>`).join('');
  const sum=b.sum?`<tr><td class="lb"><b>${esc(b.sum.label)}</b></td>${b.cols.map(c=>b.sum.cols.includes(c.k)?`<td class="calc" data-sum="${b.key}:${c.k}:${b.rows.length}" data-max="${b.sum.max||''}">–</td>`:'<td></td>').join('')}</tr>`:'';
  return `<div class="scrollx"><table class="chk" style="margin-top:6px">${head}${rows}${sum}</table></div>`;
}
function bBv(b,d,ro){
  return b.rounds.map((r,ri)=>{const n=ri+1;
    return `<section class="sx"><div class="sn">${n}</div><div class="sb"><div class="st"><u>${esc(r.title)}</u></div><div class="scrollx"><table class="chk bv"><tr><td class="lb">ครั้งที่</td>${[1,2,3,4,5].map(i=>`<td class="c">${i}</td>`).join('')}<td class="c">ค่าเฉลี่ย</td></tr><tr><td class="lb">Breakdown Voltage (kV)</td>${[1,2,3,4,5].map(i=>`<td>${inp(`bv${n}_${i}`,d,ro,{t:'num'})}</td>`).join('')}<td class="calc" data-bvavg="${n}">–</td></tr><tr><td colspan="7" class="bvnote">${esc(r.note)}<div class="verdict noprint" data-bvv="${n}"></div></td></tr></table></div></div></section>`}).join('');
}
function bDelta(b,d,ro){
  const pts='ABCDEF'.split('');
  return `<div class="mt">อุณหภูมิเปรียบเทียบที่จุดวัดฯ (Delta T)</div><div class="grid">${[1,2,3,4,5,6].map(i=>`<div class="f w6"><span class="l">ΔT ${i}</span><span class="c">${selx(`dt${i}a`,pts,d,ro)} − ${selx(`dt${i}b`,pts,d,ro)} = <b data-dt="${i}">–</b> °C <em data-dtc="${i}" style="font-size:12.5px;color:var(--p-dim)"></em></span></div>`).join('')}</div><div class="verdict" data-dtsum></div>`;
}
function bSign(b,d,ro){
  const r=(l1,k1,l2,k2,o)=>`<tr><th>${esc(l1)}</th><td>${inp(k1,d,ro,o)}</td><th>${esc(l2)}</th><td>${inp(k2,d,ro,o)}</td></tr>`;
  return `<table class="sgt">${r(b.a,'sgA',b.b,'sgB')}${r('ตำแหน่ง','sgAPos','ตำแหน่ง','sgBPos')}${r('วันที่','sgADate','วันที่','sgBDate',{t:'date'})}</table>`;
}
function renderBlocks(def,d,ro){
  let n=0,open=false,out='';
  const close=()=>{if(open){out+='</div></section>';open=false}};
  for(const b of def.blocks){
    switch(b.t){
      case 'sec':{close();const num=b.n===undefined?++n:b.n;out+=`<section class="sx"><div class="sn">${num}</div><div class="sb"><div class="secbar"><u>${esc(b.title)}</u></div>`;open=true;break}
      case 'fld':out+=bFld(b,d,ro);break;
      case 'chk':out+=bChk(b,d,ro);break;
      case 'meas':out+=bMeas(b,d,ro);break;
      case 'tbl':out+=bTbl(b,d,ro);break;
      case 'bv':close();out+=bBv(b,d,ro);break;
      case 'delta':out+=bDelta(b,d,ro);break;
      case 'static':if(b.top)close();out+=b.html;break;
      case 'area':out+=ro?`<div class="v ta" style="display:block;min-height:52px">${esc(d[b.k]||'')}</div>`:`<textarea class="ta" data-d="${b.k}" rows="2">${esc(d[b.k]||'')}</textarea>`;break;
      case 'photo':{const ids=d[b.k]||[];out+=`${b.l?`<div class="pl">${esc(b.l)}</div>`:''}<div class="photoblk" data-pk="${b.k}"><div class="photos">${photoInner(ids,ro)}</div>${ro?'':`<div class="noprint prow"><label class="btn sm">📷 ถ่ายภาพ<input type="file" accept="image/*" capture="environment" hidden data-photo="${b.k}"></label><label class="btn sm">เลือกจากคลัง<input type="file" accept="image/*" multiple hidden data-photo="${b.k}"></label></div>`}</div>`;break}
      case 'sign':close();out+=bSign(b,d,ro);break;
    }
  }
  close();return out;
}
function formSheet(def,wo,ro,blank){
  const d=blank?{}:wo.data;
  return `<article class="sheet"${ro?'':' id="sheet"'}><div class="fh">${wo&&!blank?`<div class="wref">ใบงาน ${esc(wo.no)}</div>`:''}<h2>${esc(def.title)}</h2></div>${renderBlocks(def,d,ro)}<div class="ff"><span>ปรับปรุงครั้งที่ 0 วันที่ ……………</span><span>${def.id}</span></div></article>`;
}
function progress(wo){
  const def=FORM[wo.form];let total=0,done=0,bad=0;
  def.blocks.forEach(b=>{if(b.t==='chk')b.rows.forEach(r=>{if(r.grp)return;total++;const v=wo.data[ck(r.no)];if(v)done++;if(v==='bad')bad++})});
  return{total,done,bad};
}
const dtClass=x=>x<=10?[1,'อุปกรณ์ปกติ']:x<=20?[2,'แก้ไขในการบำรุงรักษาครั้งต่อไป']:x<=40?[3,'ควรแก้ไขภายใน 1 เดือน']:[4,'ควรได้รับการแก้ไขเร่งด่วน'];
function bvVerdict(r,d){
  const v=[1,2,3,4,5].map(i=>num(d[`bv${r}_${i}`]));const f=v.filter(x=>x!==null);
  const avg=f.length?f.reduce((a,b)=>a+b,0)/f.length:null;let msg='',cls='';
  const fail=r<3?`ต่ำกว่า 26 kV → กรองน้ำมันครั้งที่ ${r}`:'ต่ำกว่า 26 kV → หาแนวทางแก้ไขต่อไป';
  if(r<3&&v[0]!==null&&v[0]<26){msg='ค่าครั้งที่ 1 '+fail;cls='bad'}
  else if(f.length===5){if(avg>=26){msg='ผ่านเกณฑ์ (ค่าเฉลี่ย ≥ 26 kV)';cls='ok'}else{msg='ค่าเฉลี่ย '+fail;cls='bad'}}
  else if(f.length>0)msg='ทดสอบต่อให้ครบ 5 ครั้ง';
  return{avg,msg,cls};
}
function recalc(){
  const wo=curWO();if(!wo)return;const d=wo.data;
  const pg=progress(wo);
  $$('[data-calc="progress"]').forEach(x=>x.textContent=`ตรวจแล้ว ${pg.done}/${pg.total} รายการ`+(pg.bad?` · ชำรุด/ไม่ปกติ ${pg.bad} รายการ`:''));
  $$('[data-rng]').forEach(el=>{const [lo,hi]=el.dataset.rng.split(',').map(Number);const v=num(el.value);el.classList.toggle('out',v!==null&&(v<lo||v>hi))});
  $$('[data-sum]').forEach(el=>{const [key,col,n]=el.dataset.sum.split(':');let s=0,any=false;for(let i=0;i<+n;i++){const v=num(d[`${key}${i}_${col}`]);if(v!==null){s+=v;any=true}}el.textContent=any?s.toFixed(1).replace(/\.0$/,''):'–';const mx=num(el.dataset.max);el.classList.toggle('out',any&&mx!==null&&s>mx)});
  $$('[data-bvavg]').forEach(el=>{const r=+el.dataset.bvavg,x=bvVerdict(r,d);el.textContent=x.avg===null?'–':x.avg.toFixed(1);const vv=$(`[data-bvv="${r}"]`,el.closest('article')||document);if(vv){vv.textContent=x.msg;vv.className='verdict '+x.cls}});
  let mx=0;
  for(let i=1;i<=6;i++){const a=d[`dt${i}a`],b=d[`dt${i}b`],ta=num(d['t'+a]),tb=num(d['t'+b]);const out=$$(`[data-dt="${i}"]`),oc=$$(`[data-dtc="${i}"]`);
    if(a&&b&&ta!==null&&tb!==null){const dt=Math.abs(ta-tb),c=dtClass(dt);mx=Math.max(mx,c[0]);out.forEach(e=>e.textContent=dt.toFixed(1).replace(/\.0$/,''));oc.forEach(e=>e.textContent=`ลำดับ ${c[0]}`)}else{out.forEach(e=>e.textContent='–');oc.forEach(e=>e.textContent='')}}
  $$('[data-dtsum]').forEach(e=>{if(mx){const c=[null,'อุปกรณ์ปกติ','แก้ไขในการบำรุงรักษาครั้งต่อไป','ควรแก้ไขภายใน 1 เดือน','ควรได้รับการแก้ไขเร่งด่วน'][mx];e.textContent=`ลำดับความสำคัญสูงสุด ${mx}: ${c}`;e.className='verdict '+(mx>=3?'bad':'ok')}else{e.textContent='';e.className='verdict'}});
  const c=coord({lat:d.lat,lng:d.lng})||coord(stOf(wo.stationId));
  $$('[data-navd]').forEach(a=>{if(c){a.href=({g:gU,a:aU,w:wU})[a.dataset.navd](c.lat,c.lng);a.style.opacity=1}else{a.removeAttribute('href');a.style.opacity=.4}});
  const hrs=hoursOf(wo),n=num(wo.crewN);
  $$('[data-calc="hrs"]').forEach(e=>e.textContent=hrs===null?'–':hrs.toFixed(2)+' ชม.');
  $$('[data-calc="mh"]').forEach(e=>e.textContent=hrs===null||n===null?'–':(hrs*n).toFixed(2)+' ชม.');
}
const hoursOf=w=>{if(!w.startAt||!w.endAt)return null;const h=(new Date(w.endAt)-new Date(w.startAt))/36e5;return h>=0?h:null};
const grow=t=>{t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px'};

    if(b.t==='meas')b.cells.forEach(c=>{if(d[c.k]!==undefined&&d[c.k]!=='')out.push([(b.title?b.title+' ':'')+c.l,d[c.k]])});
    if(b.t==='tbl')b.rows.forEach((r,i)=>b.cols.forEach(c=>{const v=d[`${b.key}${i}_${c.k}`];if(v!==undefined&&v!=='')out.push([`${b.head||''} ${r.l} ${c.l}`.trim(),v])}));
    if(b.t==='bv')[1,2,3].forEach(r=>[1,2,3,4,5].forEach(i=>{const v=d[`bv${r}_${i}`];if(v!==undefined&&v!=='')out.push([`ทดสอบชุดที่ ${r} ครั้งที่ ${i} (kV)`,v])}));
    if(b.t==='area'&&d[b.k])out.push([b.k==='todo'?'สิ่งที่ต้องปรับปรุง':b.k==='fixed'?'การปรับปรุงข้อบกพร่อง':'ข้อเสนอแนะ/หมายเหตุ',d[b.k]]);
    if(b.t==='sign'){if(d.sgA)out.push(['ผู้ตรวจ',d.sgA]);if(d.sgB)out.push(['ผู้ตรวจสอบ',d.sgB])}
  });return out;
}

    def.blocks.forEach(b=>{if(b.t==='chk')b.rows.forEach(r=>{if(r.grp)return;const k=ck(r.no),v=w.data[k];items.push([w.no,w.stationId,def.id,r.no,r.l,v?RES_TXT[v]:'',w.data[k+'_n']||'',w.data[k+'_a']||''])})});

  const wb=XLSX.utils.book_new();

async function backup(){
  const ids=new Set();state.orders.forEach(w=>Object.values(w.data).forEach(v=>{if(Array.isArray(v))v.forEach(i=>ids.add(i))}));
  const photos={};for(const id of ids){const p=await Store.getPhoto(id);if(p)photos[id]=p}
  await saveFile(`asset-inspection-backup-${today()}.json`,JSON.stringify({app:'asset-inspection',v:1,state,photos}),'application/json');
}
function parseCsv(t){
  t=t.replace(/^\uFEFF/,'');const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'&&t[i+1]==='"'){cur+='"';i++}else if(c==='"')q=false;else cur+=c}
    else if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x!==''))rows.push(row);row=[]}else cur+=c}
  row.push(cur);if(row.some(x=>x!==''))rows.push(row);return rows;
}
async function importStations(file){
  const rows=parseCsv(await file.text());if(rows.length<2){toast('ไฟล์ว่าง หรือไม่มีแถวข้อมูล');return}
  let add=0,upd=0;rows.slice(1).forEach(r=>{const id=(r[0]||'').trim();if(!id)return;const o={id,name:(r[1]||'').trim(),lat:num(r[2])??'',lng:num(r[3])??'',mea:(r[4]||'').trim(),feeder:(r[5]||'').trim(),note:(r[6]||'').trim()};const i=state.stations.findIndex(s=>s.id===id);if(i>=0){Object.assign(state.stations[i],o,{sample:false});upd++}else{state.stations.push(o);add++}});
  save();render();toast(`นำเข้าสถานี: เพิ่ม ${add} · อัปเดต ${upd}`);
}
async function importJson(file){
  try{const o=JSON.parse(await file.text());if(o.app!=='asset-inspection'||!o.state)throw 0;
    if(!(await ask('กู้คืนจะแทนที่ข้อมูลทั้งหมดในเครื่องนี้ ต้องการดำเนินการต่อหรือไม่?','กู้คืน',true)))return;
    state=o.state;for(const [id,p] of Object.entries(o.photos||{}))await Store.putPhoto(id,p);await Store.saveState(state);render();toast('กู้คืนข้อมูลแล้ว')}
  catch(e){toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของแอปนี้')}
}

function newDraftWO(o={}){
  const st=o.st?stOf(o.st):null;

}
function resolveStation(q){
  q=(q||'').trim();if(!q)return null;const id=q.split(' — ')[0].trim();
  return state.stations.find(s=>s.id===id)||state.stations.find(s=>s.id.toLowerCase()===q.toLowerCase()||s.name===q)||null;
}

  editwo(){const w=curWO();ui.draft={...w,stq:(stOf(w.stationId)?`${w.stationId} — ${stOf(w.stationId).name}`:w.stationId)};go('woedit')},
  savewo(){

    else{const w=curWO();const changed=w.stationId!==st.id;Object.assign(w,{kind:d.kind,title:d.title||w.title,detail:d.detail,plan:d.plan,due:d.due,assignee:d.assignee,every:ev});

  pick(t){const w=curWO(),k=t.dataset.k,v=t.dataset.v;if(w.data[k]===v)delete w.data[k];else w.data[k]=v;$$(`[data-act="pick"][data-k="${k}"],[data-act="rad"][data-k="${k}"]`).forEach(b=>b.setAttribute('aria-pressed',String(w.data[k]===b.dataset.v)));touch(w);recalc()},
  allok(){const w=curWO();FORM[w.form].blocks.forEach(b=>{if(b.t==='chk')b.rows.forEach(r=>{if(r.grp)return;const k=ck(r.no),al=r.opts||b.cols.map(c=>c.v);if(!w.data[k]&&al.includes('ok'))w.data[k]='ok'})});touch(w);render();toast('ตั้งข้อที่ยังไม่ได้ตรวจเป็น “ปกติ” แล้ว — แก้ข้อที่ผิดปกติได้เลย')},

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
  const a=t.dataset.act;if(!ACT[a])return;
  if(t.tagName!=='A'&&t.type!=='checkbox')e.preventDefault();
  if(t.tagName==='A'&&!t.getAttribute('href')){e.preventDefault();return}
  ACT[a](t,e);
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('wor')&&e.target.dataset.act==='openwo'){e.preventDefault();ACT.openwo(e.target)}});
const onInput=e=>{
  const t=e.target,ds=t.dataset;if(!ds)return;
  if(ds.d!==undefined){const w=curWO();if(!w)return;w.data[ds.d]=t.value;touch(w);recalc()}
  else if(ds.wo!==undefined){const w=curWO();w[ds.wo]=t.value;if(ds.wo==='startAt'||ds.wo==='endAt')touch(w);else save();recalc()}
  else if(ds.dr!==undefined){ui.draft[ds.dr]=t.value}
  else if(ds.set!==undefined){state.settings[ds.set]=t.value;save()}
  else if(ds.q!==undefined){const pos=t.selectionStart;if(ds.q==='orders')ui.q=t.value;else ui.stq=t.value;render();const n=$(`[data-q="${ds.q}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}
  if(t.tagName==='TEXTAREA')grow(t);
};
document.addEventListener('input',onInput);
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.photo!==undefined){
    const w=curWO(),k=t.dataset.photo,files=[...t.files];t.value='';if(!w||!files.length)return;toast('กำลังบันทึกภาพ…');

  if(t.dataset&&t.dataset.imp){const f=t.files[0];t.value='';if(!f)return;if(t.dataset.imp==='stcsv')importStations(f);else importJson(f);return}
  if(t.tagName==='SELECT'&&t.dataset.dr!==undefined)onInput(e);
});
