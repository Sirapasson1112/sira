<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CMMS MEA — ระบบบำรุงรักษาเชิงป้องกัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #0c1324;
    --ink-2: #121b33;
    --ink-3: #1b2645;
    --line-on-ink: rgba(255,255,255,0.09);
    --surface: #eef1f7;
    --card: #ffffff;
    --card-line: #e4e8f0;
    --text: #101a2e;
    --text-soft: #5b6478;
    --text-faint: #8992a3;
    --brand: #2f6fed;
    --brand-ink: #1c4fc4;
    --brand-soft: #e8effe;
    --amber: #f0a323;
    --amber-soft: #fdf1dc;
    --green: #17a261;
    --green-soft: #e4f7ee;
    --red: #e5484d;
    --red-soft: #fde9ea;
    --gray-soft: #eef0f4;
    --radius-card: 16px;
    --radius-sm: 10px;
    --shadow-card: 0 1px 2px rgba(16,26,46,0.04), 0 8px 24px -14px rgba(16,26,46,0.14);
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface: #0a0e18;
      --card: #121a2c;
      --card-line: #232e48;
      --text: #eef1f7;
      --text-soft: #a7b0c4;
      --text-faint: #6d7690;
      --brand-soft: #172443;
      --amber-soft: #2c220f;
      --green-soft: #0f2820;
      --red-soft: #2c1518;
      --gray-soft: #1a2338;
    }
  }
  :root[data-theme="dark"] {
    --surface: #0a0e18;
    --card: #121a2c;
    --card-line: #232e48;
    --text: #eef1f7;
    --text-soft: #a7b0c4;
    --text-faint: #6d7690;
    --brand-soft: #172443;
    --amber-soft: #2c220f;
    --green-soft: #0f2820;
    --red-soft: #2c1518;
    --gray-soft: #1a2338;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--surface);
    color: var(--text);
    font-family: "Noto Sans Thai", "Inter", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-family: "Inter", "Noto Sans Thai", sans-serif; font-variant-numeric: tabular-nums; }

  .app { display: flex; min-height: 100%; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 240px;
    flex: 0 0 240px;
    background: linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
    color: #cbd3e6;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    padding-top: env(safe-area-inset-top, 0px);
    z-index: 20;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 22px 20px 18px;
    border-bottom: 1px solid var(--line-on-ink);
  }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--brand) 0%, #5b9bff 100%);
    display: flex; align-items: center; justify-content: center;
    flex: none;
    box-shadow: 0 4px 14px -4px rgba(47,111,237,0.7);
  }
  .brand-mark svg { width: 18px; height: 18px; }
  .brand-text { line-height: 1.2; }
  .brand-text .t1 { font-weight: 800; font-size: 14.5px; color: #fff; letter-spacing: 0.2px; }
  .brand-text .t2 { font-size: 11px; color: #8b96b3; font-weight: 500; }

  .nav { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 12px; border-radius: 10px;
    font-size: 13.5px; font-weight: 500; color: #a7b1cc;
    cursor: pointer; user-select: none;
    transition: background 0.15s ease, color 0.15s ease;
    border: 1px solid transparent;
  }
  .nav-item svg { width: 17px; height: 17px; flex: none; opacity: 0.85; }
  .nav-item:hover { background: rgba(255,255,255,0.05); color: #e7ebf5; }
  .nav-item.active {
    background: linear-gradient(90deg, rgba(47,111,237,0.28), rgba(47,111,237,0.06));
    color: #ffffff;
    border-color: rgba(94,145,255,0.25);
  }
  .nav-item.active svg { opacity: 1; }
  .nav-foot { padding: 14px 20px 18px; border-top: 1px solid var(--line-on-ink); }
  .nav-foot .nav-item { color: #8b96b3; }

  /* ---------- Main ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 28px;
    background: var(--card);
    border-bottom: 1px solid var(--card-line);
    position: sticky; top: 0; z-index: 10;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
  }
  .search {
    flex: 1; max-width: 420px;
    display: flex; align-items: center; gap: 9px;
    background: var(--surface); border: 1px solid var(--card-line);
    border-radius: 10px; padding: 8px 13px;
    color: var(--text-faint);
  }
  .search svg { width: 15px; height: 15px; flex: none; }
  .search input {
    border: none; background: transparent; outline: none;
    font: inherit; font-size: 13.5px; color: var(--text); width: 100%;
  }
  .search input::placeholder { color: var(--text-faint); }
  .topbar-spacer { flex: 1; }
  .icon-btn {
    position: relative; width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface); border: 1px solid var(--card-line);
    color: var(--text-soft); cursor: pointer; flex: none;
  }
  .icon-btn svg { width: 17px; height: 17px; }
  .icon-btn .dot { position: absolute; top: 7px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--red); border: 1.5px solid var(--card); }
  .profile { display: flex; align-items: center; gap: 10px; padding-left: 10px; border-left: 1px solid var(--card-line); }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg,#8bb4ff,#2f6fed);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 13px; flex: none;
  }
  .profile-text { line-height: 1.25; }
  .profile-text .name { font-size: 13px; font-weight: 700; color: var(--text); }
  .profile-text .role { font-size: 11.5px; color: var(--text-faint); }

  .content { padding: 24px 28px 56px; max-width: 1400px; width: 100%; margin: 0 auto; }
  .page { display: none; animation: fade .35s ease; }
  .page.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .page-head h1 { font-size: 21px; font-weight: 800; margin: 0 0 3px; letter-spacing: -0.2px; }
  .page-head p { margin: 0; color: var(--text-soft); font-size: 13.5px; }
  .head-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
    border: 1px solid var(--card-line); background: var(--card); color: var(--text);
    cursor: pointer; white-space: nowrap;
  }
  .btn svg { width: 15px; height: 15px; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 6px 16px -6px rgba(47,111,237,0.6); }
  .btn.primary:hover { background: var(--brand-ink); }
  .btn:hover { background: var(--surface); }
  .btn.primary:hover { background: var(--brand-ink); }

  /* ---------- Grid / cards ---------- */
  .grid { display: grid; gap: 16px; }
  .kpis { grid-template-columns: repeat(4, 1fr); margin-bottom: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--card-line);
    border-radius: var(--radius-card); box-shadow: var(--shadow-card);
  }
  .kpi { padding: 18px 18px 16px; display: flex; align-items: flex-start; gap: 13px; }
  .kpi-icon { width: 40px; height: 40px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; }
  .kpi-icon svg { width: 19px; height: 19px; }
  .kpi-icon.blue { background: var(--brand-soft); color: var(--brand); }
  .kpi-icon.green { background: var(--green-soft); color: var(--green); }
  .kpi-icon.amber { background: var(--amber-soft); color: var(--amber); }
  .kpi-icon.red { background: var(--red-soft); color: var(--red); }
  .kpi-body { min-width: 0; }
  .kpi-label { font-size: 12px; color: var(--text-soft); font-weight: 600; margin-bottom: 3px; }
  .kpi-value { font-size: 23px; font-weight: 800; line-height: 1.15; }
  .kpi-sub { font-size: 11.5px; font-weight: 600; margin-top: 3px; }
  .kpi-sub.up { color: var(--green); }
  .kpi-sub.pct { color: var(--text-faint); }

  .two-col { grid-template-columns: 1.6fr 1fr; align-items: stretch; }
  .three-col { grid-template-columns: 1fr 1fr 1fr; }
  .panel { padding: 20px 20px 8px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .panel-head h3 { font-size: 14.5px; font-weight: 700; margin: 0; }
  .panel-head .muted { font-size: 12px; color: var(--text-faint); }
  .link-more { font-size: 12px; color: var(--brand); font-weight: 600; cursor: pointer; }

  .donut-wrap { display: flex; flex-direction: column; align-items: center; padding: 20px; }
  .donut-canvas-box { position: relative; width: 168px; height: 168px; margin-bottom: 6px; }
  .donut-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  .donut-center .big { font-size: 22px; font-weight: 800; }
  .donut-center .small { font-size: 10.5px; color: var(--text-faint); font-weight: 600; }
  .legend { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 8px; }
  .legend-row { display: flex; align-items: center; gap: 9px; font-size: 12.5px; }
  .legend-dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .legend-row .lbl { color: var(--text-soft); flex: 1; }
  .legend-row .val { font-weight: 700; }

  /* ---------- table ---------- */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.8px; min-width: 560px; }
  thead th {
    text-align: left; padding: 10px 14px; font-weight: 700; color: var(--text-faint);
    font-size: 11.5px; text-transform: none; border-bottom: 1px solid var(--card-line);
    white-space: nowrap;
  }
  tbody td { padding: 12px 14px; border-bottom: 1px solid var(--card-line); white-space: nowrap; color: var(--text); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface); }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px;
    border-radius: 100px; font-size: 11.5px; font-weight: 700;
  }
  .badge::before { content:""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.green { background: var(--green-soft); color: var(--green); }
  .badge.amber { background: var(--amber-soft); color: var(--amber); }
  .badge.red { background: var(--red-soft); color: var(--red); }
  .badge.blue { background: var(--brand-soft); color: var(--brand); }
  .badge.gray { background: var(--gray-soft); color: var(--text-faint); }
  .row-icon-btn {
    width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--card-line);
    background: var(--card); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-soft);
  }
  .row-icon-btn svg { width: 13px; height: 13px; }

  .table-toolbar { display: flex; gap: 10px; align-items: center; padding: 16px 20px; flex-wrap: wrap; }
  .search-sm { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--card-line); border-radius: 9px; padding: 8px 12px; }
  .search-sm svg { width: 14px; height: 14px; color: var(--text-faint); flex: none; }
  .search-sm input { border: none; background: transparent; outline: none; font: inherit; font-size: 13px; width: 100%; color: var(--text); }
  .select-sm { border: 1px solid var(--card-line); background: var(--card); border-radius: 9px; padding: 8px 12px; font-size: 13px; color: var(--text-soft); font-family: inherit; }

  .table-foot { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; flex-wrap: wrap; gap: 10px; }
  .table-foot .count { font-size: 12px; color: var(--text-faint); }
  .pager { display: flex; gap: 5px; align-items: center; }
  .pg-btn { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--card-line); background: var(--card); color: var(--text-soft); font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .pg-btn.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  .pg-dots { color: var(--text-faint); font-size: 12px; padding: 0 2px; }

  /* filter chip row for work order */
  .chip-row { display: flex; gap: 8px; padding: 16px 20px 0; flex-wrap: wrap; }
  .chip { padding: 8px 14px; border-radius: 9px; font-size: 12.5px; font-weight: 700; background: var(--surface); border: 1px solid var(--card-line); color: var(--text-soft); cursor: pointer; }
  .chip .n { font-weight: 800; margin-left: 5px; }
  .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* ---------- Calendar (PM planning) ---------- */
  .cal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 6px; }
  .cal-head h3 { margin: 0; font-size: 15px; font-weight: 800; }
  .cal-head .sub { font-size: 12px; color: var(--text-faint); margin-top: 2px; }
  .cal-nav { display: flex; gap: 6px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 12px 20px 6px; }
  .cal-dow { text-align: center; font-size: 11px; font-weight: 700; color: var(--text-faint); padding-bottom: 4px; }
  .cal-cell {
    min-height: 70px; border: 1px solid var(--card-line); border-radius: 10px; padding: 6px 6px;
    font-size: 11.5px; color: var(--text-soft); background: var(--surface);
    display: flex; flex-direction: column; gap: 3px;
  }
  .cal-cell.muted { opacity: 0.35; }
  .cal-cell .d { font-weight: 700; color: var(--text); font-size: 12px; }
  .cal-ev { border-radius: 5px; padding: 2px 5px; font-size: 9.5px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-ev.blue { background: var(--brand); }
  .cal-ev.amber { background: var(--amber); }
  .cal-ev.gray { background: #7c879c; }
  .cal-legend { display: flex; gap: 16px; padding: 10px 20px 18px; flex-wrap: wrap; }
  .cal-legend .item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-soft); }
  .cal-legend .dot { width: 8px; height: 8px; border-radius: 3px; }

  .side-stack { display: flex; flex-direction: column; gap: 16px; }
  .mini-stat-list { display: flex; flex-direction: column; }
  .mini-stat-row { display: flex; align-items: center; gap: 10px; padding: 11px 20px; border-bottom: 1px solid var(--card-line); }
  .mini-stat-row:last-child { border-bottom: none; }
  .mini-stat-row .dot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
  .mini-stat-row .lbl { flex: 1; font-size: 12.8px; color: var(--text-soft); }
  .mini-stat-row .val { font-weight: 800; font-size: 13.5px; }

  /* Reports */
  .rep-tabs { display: flex; gap: 6px; padding: 6px; background: var(--surface); border-radius: 11px; width: fit-content; margin-bottom: 18px; border: 1px solid var(--card-line); }
  .rep-tab { padding: 8px 16px; border-radius: 8px; font-size: 12.8px; font-weight: 700; color: var(--text-soft); cursor: pointer; }
  .rep-tab.active { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(16,26,46,0.1); }
  .rep-list { display: flex; flex-direction: column; gap: 12px; }
  .rep-card { display: flex; align-items: center; gap: 14px; padding: 16px 18px; }
  .rep-ic { width: 42px; height: 42px; border-radius: 11px; background: var(--brand-soft); color: var(--brand); display: flex; align-items: center; justify-content: center; flex: none; }
  .rep-ic svg { width: 19px; height: 19px; }
  .rep-body { flex: 1; min-width: 0; }
  .rep-body .t { font-weight: 700; font-size: 13.5px; margin-bottom: 2px; }
  .rep-body .d { font-size: 12px; color: var(--text-faint); }

  /* Inspection forms */
  .insp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .insp-card { padding: 16px 17px; cursor: pointer; transition: border-color .15s ease; }
  .insp-card:hover { border-color: var(--brand); }
  .insp-card .code { font-size: 11px; font-weight: 700; color: var(--brand); font-family: "Inter","Noto Sans Thai",sans-serif; margin-bottom: 6px; }
  .insp-card .ic { width: 38px; height: 38px; border-radius: 10px; background: var(--brand-soft); color: var(--brand); display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
  .insp-card .ic svg { width: 17px; height: 17px; }
  .insp-card .t { font-size: 13.5px; font-weight: 700; line-height: 1.4; margin-bottom: 4px; }
  .insp-card .d { font-size: 11.5px; color: var(--text-faint); }
  .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--text-soft); cursor: pointer; margin-bottom: 14px; }
  .back-link svg { width: 14px; height: 14px; }
  .insp-detail-head { padding: 20px 22px 16px; border-bottom: 1px solid var(--card-line); }
  .insp-detail-head .code { font-size: 11.5px; font-weight: 700; color: var(--brand); margin-bottom: 4px; font-family: "Inter","Noto Sans Thai",sans-serif; }
  .insp-detail-head h2 { font-size: 17px; font-weight: 800; margin: 0; }
  .insp-header-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 16px; padding: 18px 22px; }
  .insp-field label { display: block; font-size: 11.5px; font-weight: 700; color: var(--text-soft); margin-bottom: 5px; }
  .insp-field input { width: 100%; border: 1px solid var(--card-line); background: var(--surface); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 12.8px; color: var(--text); }
  .insp-section-title { padding: 14px 22px 6px; font-size: 12.5px; font-weight: 800; color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
  .insp-item-row { display: grid; grid-template-columns: 1.7fr repeat(3, 60px) 1.4fr; gap: 10px; align-items: center; padding: 9px 22px; border-bottom: 1px solid var(--card-line); }
  .insp-item-row .lbl { font-size: 12.5px; color: var(--text); }
  .insp-radio { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: var(--text-faint); font-weight: 600; cursor: pointer; }
  .insp-radio input { width: 15px; height: 15px; accent-color: var(--brand); cursor: pointer; }
  .insp-item-row input[type="text"] { border: 1px solid var(--card-line); background: var(--surface); border-radius: 7px; padding: 6px 9px; font: inherit; font-size: 12px; width: 100%; color: var(--text); }
  .insp-footer { padding: 18px 22px 22px; }
  .insp-footer label { display: block; font-size: 11.5px; font-weight: 700; color: var(--text-soft); margin-bottom: 6px; }
  .insp-footer textarea { width: 100%; min-height: 64px; border: 1px solid var(--card-line); background: var(--surface); border-radius: 9px; padding: 10px 12px; font: inherit; font-size: 12.8px; color: var(--text); resize: vertical; }
  .insp-sign-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 14px; }
  .insp-actions { display: flex; gap: 10px; justify-content: flex-end; padding: 16px 22px; border-top: 1px solid var(--card-line); }
  .insp-oil-table { width: 100%; border-collapse: collapse; margin: 8px 22px 4px; width: calc(100% - 44px); }
  .insp-oil-table th, .insp-oil-table td { border: 1px solid var(--card-line); padding: 8px 10px; font-size: 12px; text-align: center; }
  .insp-oil-table th { background: var(--surface); color: var(--text-soft); font-weight: 700; }
  .insp-oil-table td input { width: 64px; border: 1px solid var(--card-line); border-radius: 6px; padding: 5px; text-align: center; font: inherit; font-size: 12px; }
  .insp-photo-box { border: 1.5px dashed var(--card-line); border-radius: 12px; height: 140px; display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-size: 12px; background: var(--surface); }

  /* Paper-form replica: black-and-white bordered table layout, styled to read like the printed original */
  .paper-sheet { max-width: 860px; margin: 0 auto; }
  .paper-wrap { background: #ffffff; color: #111827; font-family: "Noto Sans Thai","Inter",sans-serif; padding: 26px 28px 22px; border: 1px solid var(--card-line); border-radius: 10px; box-shadow: var(--shadow-card); }
  .paper-title { text-align: center; font-size: 15.5px; font-weight: 800; margin-bottom: 16px; }
  .paper-table { width: 100%; border-collapse: collapse; margin-bottom: 14px; font-size: 12px; }
  .paper-table th, .paper-table td { border: 1px solid #111827; padding: 6px 9px; vertical-align: middle; }
  .paper-table th { background: #f3f4f6; font-weight: 700; font-size: 11.5px; }
  .paper-table td.lbl { background: #f9fafb; font-weight: 600; white-space: nowrap; }
  .paper-table td.blank { min-width: 80px; }
  .paper-table input[type="text"] { width: 100%; border: none; background: transparent; font: inherit; font-size: 12px; color: #111827; outline: none; }
  .paper-section-row td { background: #e5e7eb; font-weight: 700; text-decoration: underline; text-underline-offset: 2px; font-size: 12px; }
  .paper-check-cell { text-align: center; white-space: nowrap; }
  .paper-check { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; font-size: 11.5px; padding: 2px 0; }
  .paper-check-cell input[type="radio"], .paper-check input[type="radio"] {
    width: 14px; height: 14px; margin: 0; cursor: pointer; flex: none;
    appearance: none; -webkit-appearance: none; border: 1.5px solid #111827; border-radius: 2px; position: relative; background: #fff;
  }
  .paper-check-cell input[type="radio"]:checked::after, .paper-check input[type="radio"]:checked::after {
    content: ""; position: absolute; inset: 2.5px; background: #111827;
  }
  .paper-sign-table td { text-align: center; padding-top: 26px; font-size: 12px; line-height: 2; }
  .paper-doc-footer { display: flex; justify-content: space-between; font-size: 10.5px; color: #4b5563; padding-top: 6px; border-top: 1px solid #e5e7eb; }
  @media print {
    .sidebar, .topbar, .page-head, .back-link, .insp-actions, .insp-tabs, .modal-overlay, .toast, .notif-panel { display: none !important; }
    .content { padding: 0 !important; }
    .paper-sheet { max-width: 100% !important; }
    .paper-wrap { border: none !important; box-shadow: none !important; border-radius: 0 !important; }
  }

  /* Inspection detail: tab switcher between checklist form (SF) and work instruction (WI) */
  .insp-tabs { display: flex; gap: 6px; padding: 6px; background: var(--surface); border-radius: 11px; width: fit-content; margin: 0 auto 16px; border: 1px solid var(--card-line); }
  .insp-tab { padding: 8px 18px; border-radius: 8px; font-size: 12.8px; font-weight: 700; color: var(--text-soft); cursor: pointer; }
  .insp-tab.active { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(16,26,46,0.1); }

  /* Work instruction (WI) manual document */
  .wi-doc-head { text-align: center; margin-bottom: 18px; }
  .wi-kicker { font-size: 12px; font-weight: 600; color: #4b5563; }
  .wi-doc-title { font-size: 16px; font-weight: 800; margin: 6px 0 4px; }
  .wi-doc-code { font-size: 12px; color: #4b5563; }
  .wi-section-title { background: #e5e7eb; font-weight: 700; text-decoration: underline; text-underline-offset: 2px; font-size: 12.5px; padding: 7px 11px; margin: 16px 0 8px; border-radius: 5px; }
  .wi-ol { margin: 0 0 6px; padding-left: 20px; font-size: 12.5px; line-height: 1.75; color: #1f2937; }
  .wi-ol li { margin-bottom: 3px; }
  .wi-work .wi-line { font-size: 12.5px; line-height: 1.75; padding: 2px 0 2px 10px; color: #1f2937; }
  .wi-work .wi-subhead { font-weight: 700; text-decoration: underline; text-underline-offset: 2px; margin: 10px 0 4px; font-size: 12.5px; color: #111827; }
  .wi-note { font-size: 11.5px; color: #4b5563; margin: 10px 0 4px; font-style: italic; }

  /* Cost page */
  .cost-kpis { grid-template-columns: repeat(4, 1fr); }
  .cost-kpi { padding: 16px 18px; }
  .cost-kpi .lbl { font-size: 11.5px; color: var(--text-faint); font-weight: 700; margin-bottom: 6px; }
  .cost-kpi .v { font-size: 19px; font-weight: 800; }
  .bar-wrap { height: 230px; padding: 4px 12px 16px; }
  .chart-fallback { display:flex; align-items:center; justify-content:center; height:100%; width:100%; color:var(--text-faint); font-size:12.5px; text-align:center; padding:12px; line-height:1.6; }

  @media (max-width: 1180px) {
    .kpis, .cost-kpis { grid-template-columns: repeat(2, 1fr); }
    .two-col, .three-col { grid-template-columns: 1fr; }
  }
  @media (max-width: 860px) {
    .sidebar { position: fixed; left: -260px; transition: left .2s ease; box-shadow: 0 0 0 100vmax rgba(0,0,0,0); }
    .sidebar.open { left: 0; box-shadow: 20px 0 40px rgba(0,0,0,0.35); }
    .menu-btn { display: flex !important; }
    .search { display: none; }
    .content { padding: 18px 16px 48px; }
    .kpis, .cost-kpis { grid-template-columns: 1fr 1fr; }
  }
  .menu-btn { display: none; }
  .scroll-x-hint { font-size: 11px; color: var(--text-faint); padding: 0 20px 12px; }

  /* Modal dialog */
  .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.55); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal-panel { background: var(--card); border-radius: 16px; max-width: 560px; width: 100%; max-height: 88vh; overflow-y: auto; box-shadow: 0 24px 60px -20px rgba(0,0,0,0.45); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--card-line); position: sticky; top: 0; background: var(--card); }
  .modal-head h3 { margin: 0; font-size: 15px; font-weight: 800; }
  .modal-close { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--card-line); background: var(--surface); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-soft); flex: none; }
  .modal-close svg { width: 14px; height: 14px; }
  .modal-body { padding: 18px 22px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 22px; border-top: 1px solid var(--card-line); }

  /* Toast */
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%,20px); background: var(--ink); color: #fff; padding: 11px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 300; box-shadow: 0 14px 30px -10px rgba(0,0,0,0.4); max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%,0); }

  /* Notification dropdown */
  .notif-panel { position: absolute; top: 44px; right: 0; width: 280px; background: var(--card); border: 1px solid var(--card-line); border-radius: 12px; box-shadow: var(--shadow-card); padding: 6px; z-index: 60; }
  .notif-head { font-size: 12.5px; font-weight: 800; padding: 8px 10px 4px; }

  /* Toggle switch */
  .switch { position: relative; display: inline-block; width: 40px; height: 22px; vertical-align: middle; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider { position: absolute; cursor: pointer; inset: 0; background: var(--card-line); transition: .2s; border-radius: 999px; }
  .switch .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider { background: var(--brand); }
  .switch input:checked + .slider::before { transform: translateX(18px); }
  .pg-btn:disabled { opacity: .4; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">

        <input type="text" id="topSearchInput" placeholder="ค้นหาสายป้อน, อุปกรณ์, สถานที่..." onkeydown="if(event.key==='Enter') runTopSearch(this.value)">
      </div>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="dot"></span>

<script>
/* ===================== ICONS ===================== */
const ICONS = {
  dashboard: `<rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/>`,
  calendar: `<rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 3v3M16 3v3"/>`,
  zap: `<path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/>`,
  box: `<path d="M21 8V6a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 6v12a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7v-2"/><path d="m3.3 6.9 8.7 5 8.7-5M12 21.9V12"/>`,
  branch: `<circle cx="6" cy="6" r="2.6"/><circle cx="6" cy="18" r="2.6"/><circle cx="18" cy="8" r="2.6"/><path d="M6 8.6v6.8M8.4 6h5.2a4 4 0 0 1 4 4v0"/>`,
  server: `<rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/>`,
  clipboard: `<rect x="6" y="4" width="12" height="17" rx="2"/><rect x="9" y="2.3" width="6" height="3.4" rx="1"/><path d="M9 11h6M9 15h6"/>`,
  coin: `<circle cx="12" cy="12" r="9"/><path d="M12 7.5v9M15 9.7c0-1.2-1.3-2.2-3-2.2s-3 .9-3 2.2 1.3 1.9 3 2.3c1.7.4 3 1.1 3 2.3 0 1.2-1.3 2.2-3 2.2s-3-1-3-2.2"/>`,
  chart: `<path d="M4 20V10M12 20V4M20 20v-7"/><path d="M2 20h20"/>`,
  search: `<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>`,
  plus: `<path d="M12 5v14M5 12h14"/>`,
  edit: `<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>`,
  eye: `<path d="M1 12s4-7.5 11-7.5S23 12 23 12s-4 7.5-11 7.5S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>`,
  chevL: `<path d="m15 18-6-6 6-6"/>`,
  chevR: `<path d="m9 18 6-6-6-6"/>`,
  download: `<path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/>`,
  file: `<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/><path d="M14 2v6h6"/>`,
  checklist: `<rect x="3.5" y="3" width="17" height="18" rx="2"/><path d="m7.5 8 1.3 1.3L11 7"/><path d="M13 8h5.2"/><path d="m7.5 14 1.3 1.3L11 13"/><path d="M13 14h5.2"/>`,
  arrowLeft: `<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>`,
  thermo: `<path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>`,
  waves: `<path d="M2 12c1.5-2 3-2 4.5 0s3 2 4.5 0 3-2 4.5 0 3 2 4.5 0"/><path d="M2 18c1.5-2 3-2 4.5 0s3 2 4.5 0 3-2 4.5 0 3 2 4.5 0"/>`,
  droplet: `<path d="M12 2s7 7.5 7 12a7 7 0 0 1-14 0c0-4.5 7-12 7-12z"/>`,
};
function ic(name, extra=""){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${extra}>${ICONS[name]}</svg>`; }

/* ===================== NAV ===================== */
const NAV = [
  {id:"dashboard", label:"หน้าหลัก", icon:"dashboard"},
  {id:"pmplanning", label:"วางแผน PM", icon:"calendar"},
  {id:"feeder", label:"สายป้อน (Feeder)", icon:"zap"},
  {id:"transformer", label:"หม้อแปลงจำหน่าย", icon:"box"},
  {id:"lbs", label:"สวิตช์ตัดตอน (LBS)", icon:"branch"},
  {id:"substation", label:"สถานีย่อย", icon:"server"},
  {id:"workorder", label:"ใบงาน", icon:"clipboard"},
  {id:"inspection", label:"ใบตรวจสอบบำรุงรักษา", icon:"checklist"},
  {id:"cost", label:"ต้นทุนบำรุงรักษา", icon:"coin"},
  {id:"reports", label:"รายงาน", icon:"chart"},
];
const navList = document.getElementById("navList");
NAV.forEach(n=>{
  const el = document.createElement("div");
  el.className = "nav-item" + (n.id==="dashboard" ? " active" : "");
  el.dataset.page = n.id;
  el.onclick = () => goTo(n.id);
  el.innerHTML = ic(n.icon) + `<span>${n.label}</span>`;
  navList.appendChild(el);
});

function goTo(id){
  document.querySelectorAll(".nav-item").forEach(e => e.classList.toggle("active", e.dataset.page === id));
  document.querySelectorAll(".page").forEach(e => e.classList.toggle("active", e.id === "page-"+id));
  document.getElementById("sidebar").classList.remove("open");
  window.scrollTo({top:0, behavior:"instant"});
  // Charts on a page that was hidden (display:none) at creation time render at 0x0.
  // Whenever a page becomes visible, (re)build its charts once real layout exists.
  requestAnimationFrame(() => { if (window.initChartsFor) window.initChartsFor(id); });
}

/* ===================== SHARED UI: modal / toast / notifications ===================== */
function openModal(title, bodyHtml, footerHtml){
  let overlay = document.getElementById("modalOverlay");
  if (!overlay){
    overlay = document.createElement("div");
    overlay.id = "modalOverlay";
    overlay.className = "modal-overlay";
    document.body.appendChild(overlay);
  }
  overlay.innerHTML = `<div class="modal-panel">
    <div class="modal-head"><h3>${title}</h3><button class="modal-close" onclick="closeModal()">${ic('plus', 'style="transform:rotate(45deg)"')}</button></div>
    <div class="modal-body">${bodyHtml}</div>
    ${footerHtml ? `<div class="modal-foot">${footerHtml}</div>` : ""}
  </div>`;
  overlay.classList.add("open");
  overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
}
window.openModal = openModal;
window.closeModal = function(){
  const overlay = document.getElementById("modalOverlay");
  if (overlay) overlay.classList.remove("open");
};

let toastTimer;
function showToast(msg){
  let el = document.getElementById("toastEl");
  if (!el){
    el = document.createElement("div");
    el.id = "toastEl";
    el.className = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}
window.showToast = showToast;

function closeNotifOnOutside(e){
  const panel = document.getElementById("notifPanel");
  const bell = document.getElementById("notifBellBtn");
  if (panel && bell && !bell.contains(e.target)){
    panel.remove();
    document.removeEventListener("click", closeNotifOnOutside);
  }
}
window.toggleNotifications = function(e){
  if (e) e.stopPropagation();
  const existing = document.getElementById("notifPanel");
  if (existing){ existing.remove(); document.removeEventListener("click", closeNotifOnOutside); return; }
  const panel = document.createElement("div");
  panel.id = "notifPanel";
  panel.className = "notif-panel";
  panel.innerHTML = `
    <div class="notif-head">การแจ้งเตือนล่าสุด</div>
    <div class="mini-stat-row"><span class="dot" style="background:var(--red)"></span><span class="lbl">LBS-0210 แถวเสาธงเกิดคลิกลัดวงจร</span></div>
    <div class="mini-stat-row"><span class="dot" style="background:var(--amber)"></span><span class="lbl">TR-0078 อุณหภูมิสูงกว่าเกณฑ์</span></div>
    <div class="mini-stat-row"><span class="dot" style="background:var(--green)"></span><span class="lbl">PM-0067 ดำเนินการเสร็จสิ้น</span></div>
  `;
  document.getElementById("notifBellBtn").appendChild(panel);
  setTimeout(() => document.addEventListener("click", closeNotifOnOutside), 0);
};

window.runTopSearch = function(query){
  const q = (query || "").trim();
  if (!q){ showToast("กรุณาพิมพ์คำค้นหา"); return; }
  showToast(`ค้นหา "${q}" — เลือกเมนูด้านซ้ายเพื่อดูรายการที่เกี่ยวข้อง`);
};

/* ===================== helpers ===================== */
function badge(text, kind){ return `<span class="badge ${kind}">${text}</span>`; }
function statusBadge(status){
  const map = {
    "ใช้งาน":"green", "เสร็จสิ้น":"green",
    "ซ่อมบำรุง":"amber", "รอดำเนินการ":"amber",
    "หยุดใช้งาน":"red", "เกินกำหนด":"red",
    "กำลังดำเนินการ":"blue",
    "ยกเลิก":"gray",
  };
  return badge(status, map[status] || "gray");
}
/* ===================== DATA TABLE ENGINE (search + filter + real pagination + add/view/edit) ===================== */
const TableState = {};

function initAssetTable(tableId, config){
  TableState[tableId] = { data: config.data, page: 1, pageSize: config.pageSize || 4, search: "", status: "", config };
  renderTable(tableId);
}

function getFilteredRows(tableId){
  const st = TableState[tableId];
  let rows = st.data;
  if (st.status) rows = rows.filter(r => r.status === st.status);
  if (st.search){
    const q = st.search.toLowerCase();
    rows = rows.filter(r => st.config.searchKeys.some(k => String(r[k] ?? "").toLowerCase().includes(q)));
  }
  return rows;
}

function buildPagerHtml(tableId, page, totalPages){
  let html = `<button class="pg-btn" onclick="gotoTablePage('${tableId}',${page-1})" ${page<=1?"disabled":""}>${ic('chevL')}</button>`;
  const windowSize = 3;
  let start = Math.max(1, page-1);
  let end = Math.min(totalPages, start+windowSize-1);
  start = Math.max(1, end-windowSize+1);
  if (start > 1){ html += `<button class="pg-btn" onclick="gotoTablePage('${tableId}',1)">1</button>`; if (start > 2) html += `<span class="pg-dots">…</span>`; }
  for (let p = start; p <= end; p++) html += `<button class="pg-btn ${p===page?"active":""}" onclick="gotoTablePage('${tableId}',${p})">${p}</button>`;
  if (end < totalPages){ if (end < totalPages-1) html += `<span class="pg-dots">…</span>`; html += `<button class="pg-btn" onclick="gotoTablePage('${tableId}',${totalPages})">${totalPages}</button>`; }
  html += `<button class="pg-btn" onclick="gotoTablePage('${tableId}',${page+1})" ${page>=totalPages?"disabled":""}>${ic('chevR')}</button>`;
  return html;
}

function renderTable(tableId){
  const st = TableState[tableId];
  if (!st) return;
  const rows = getFilteredRows(tableId);
  const totalPages = Math.max(1, Math.ceil(rows.length / st.pageSize));
  if (st.page > totalPages) st.page = totalPages;
  const startIdx = (st.page - 1) * st.pageSize;
  const pageRows = rows.slice(startIdx, startIdx + st.pageSize);
  const cols = st.config.columns;
  const thead = cols.map(c => `<th>${c.label}</th>`).join("") + "<th>สถานะ</th><th>จัดการ</th>";
  const tbody = pageRows.map(r => {
    const cells = cols.map(c => `<td>${r[c.key]}</td>`).join("");
    return `<tr>${cells}<td>${statusBadge(r.status)}</td><td>
      <button class="row-icon-btn" title="ดู" onclick="viewAssetRow('${tableId}','${r.id}')">${ic('eye')}</button>
      <button class="row-icon-btn" title="แก้ไข" onclick="editAssetRow('${tableId}','${r.id}')">${ic('edit')}</button>
    </td></tr>`;
  }).join("") || `<tr><td colspan="${cols.length+2}" style="text-align:center; color:var(--text-faint); padding:26px;">ไม่พบข้อมูลที่ตรงกับการค้นหา</td></tr>`;
  const tableWrap = document.getElementById(tableId+"-table-wrap");
  if (tableWrap) tableWrap.innerHTML = `<table><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table>`;
  const countEl = document.getElementById(tableId+"-count");
  if (countEl) countEl.textContent = rows.length ? `แสดง ${startIdx+1}-${Math.min(startIdx+st.pageSize, rows.length)} จาก ${rows.length} รายการ` : "ไม่พบข้อมูล";
  const pagerEl = document.getElementById(tableId+"-pager");
  if (pagerEl) pagerEl.innerHTML = buildPagerHtml(tableId, st.page, totalPages);
  const kpiEl = document.getElementById(tableId+"-kpi-total");
  if (kpiEl) kpiEl.textContent = st.data.length;
  if (tableId === "workorder") renderWorkOrderChips();
}

window.gotoTablePage = function(tableId, page){
  const st = TableState[tableId]; if (!st) return;
  st.page = Math.max(1, page);
  renderTable(tableId);
};
window.setTableSearch = function(tableId, value){
  const st = TableState[tableId]; if (!st) return;
  st.search = value; st.page = 1; renderTable(tableId);
};
window.setTableStatus = function(tableId, value){
  const st = TableState[tableId]; if (!st) return;
  st.status = value; st.page = 1; renderTable(tableId);
};

function statusOptionsFor(tableId){
  return TableState[tableId].config.statusOptions || ["ใช้งาน","ซ่อมบำรุง","หยุดใช้งาน"];
}
function fieldFormHtml(tableId, values){
  const st = TableState[tableId];
  const fields = st.config.columns.map(c => `<div class="insp-field"><label>${c.label}</label><input type="text" id="tf-${c.key}" value="${values && values[c.key]!==undefined ? values[c.key] : ""}"></div>`).join("");
  const opts = statusOptionsFor(tableId).map(s => `<option value="${s}" ${values && values.status===s ? "selected" : ""}>${s}</option>`).join("");
  return `<div class="insp-header-grid">${fields}<div class="insp-field"><label>สถานะ</label><select id="tf-status" class="select-sm" style="width:100%;">${opts}</select></div></div>`;
}

window.viewAssetRow = function(tableId, rowId){

  const rowsHtml = st.config.columns.map(c => `<div class="mini-stat-row"><span class="lbl">${c.label}</span><span class="val">${row[c.key]}</span></div>`).join("")
    + `<div class="mini-stat-row"><span class="lbl">สถานะ</span><span class="val">${statusBadge(row.status)}</span></div>`;

window.editAssetRow = function(tableId, rowId){

    `<button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn primary" onclick="saveAssetEdit('${tableId}','${rowId}')">บันทึก</button>`);
};
window.saveAssetEdit = function(tableId, rowId){
  const st = TableState[tableId]; const row = st.data.find(r => r.id === rowId); if (!row) return;
  st.config.columns.forEach(c => { const el = document.getElementById("tf-"+c.key); if (el) row[c.key] = el.value; });

window.saveNewAssetRow = function(tableId){
  const st = TableState[tableId];
  const newRow = { id: tableId + "-new-" + Date.now() };
  st.config.columns.forEach(c => { const el = document.getElementById("tf-"+c.key); newRow[c.key] = el ? el.value : ""; });

  closeModal(); renderTable(tableId); showToast("เพิ่มรายการเรียบร้อยแล้ว");
};

function buildCalendar(){
  // Sept, generic 5-week layout starting Monday as day 1 for demo purposes
  const startOffset = 1; // 1 = grid starts sun blank, mon=1
  const daysInMonth = 30;
  const byDay = {};
  PM_EVENTS.forEach(e => { (byDay[e.day] = byDay[e.day] || []).push(e); });
  let html = "";
  for(let i=0;i<startOffset;i++) html += `<div class="cal-cell muted"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const evs = byDay[d] || [];
    html += `<div class="cal-cell"><div class="d">${d}</div>${evs.map(e=>`<div class="cal-ev ${e.c}">${e.t}</div>`).join("")}</div>`;
  }
  const total = startOffset + daysInMonth;
  const rem = (7 - (total % 7)) % 7;
  for(let i=0;i<rem;i++) html += `<div class="cal-cell muted"></div>`;
  return html;
}

};
window.switchReportTab = function(tab){
  document.querySelectorAll(".rep-tab").forEach((el,i) => el.classList.toggle("active", (i===0 && tab==="std") || (i===1 && tab==="custom")));

  if (!listEl) return;
  listEl.innerHTML = tab === "std"
    ? REPORTS.map((r,i) => reportCardHtml(r,i)).join("")
    : `<div class="card" style="padding:40px; text-align:center; color:var(--text-faint);">ยังไม่มีรายงานที่กำหนดเอง<br><button class="btn primary" style="margin-top:12px;" onclick="showToast('ฟีเจอร์สร้างรายงานกำหนดเองจะเปิดให้ใช้งานเร็วๆ นี้')">${ic('plus')} สร้างรายงานใหม่</button></div>`;

// Header info laid out as label|blank pairs, two pairs per row — mirrors how the
// paper forms box off "Station ID ____  GIS ____" style fields.
function paperFieldRows(fields){
  let rows = "";
  for (let i = 0; i < fields.length; i += 2){
    const f1 = fields[i], f2 = fields[i+1];
    rows += `<tr><td class="lbl">${f1}</td><td class="blank"><input type="text"></td>`;
    rows += f2 ? `<td class="lbl">${f2}</td><td class="blank"><input type="text"></td></tr>` : `<td class="lbl" colspan="2"></td></tr>`;
  }
  return `<table class="paper-table">${rows}</table>`;
}

function paperChecklistTable(f){
  const opts = f.resultOptions || DEFAULT_RESULT_OPTS;
  let seq = 0;
  let rows = `<tr><th rowspan="2" style="width:38%;">รายการ</th><th colspan="${opts.length}">ผลการตรวจสอบ</th><th rowspan="2" style="width:22%;">ข้อบกพร่อง</th></tr><tr>${opts.map(o=>`<th>${o}</th>`).join("")}</tr>`;
  f.sections.forEach(sec => {
    if (sec.title) rows += `<tr class="paper-section-row"><td colspan="${opts.length+2}">${sec.title}</td></tr>`;
    sec.items.forEach(item => {
      seq++;
      const name = `${f.code}-r${seq}`;
      const checks = opts.map(() => `<td class="paper-check-cell"><input type="radio" name="${name}"></td>`).join("");
      rows += `<tr><td>${item}</td>${checks}<td><input type="text"></td></tr>`;
    });
  });
  return `<table class="paper-table paper-checklist">${rows}</table>`;
}

}

// Every input/textarea inside the currently open paper form is saved/restored by DOM order,
// keyed to the form's code — a working "save" without needing a backend.
function paperInputs(){
  return Array.from(document.querySelectorAll(".paper-wrap input, .paper-wrap textarea"));
}
window.saveInspectionForm = function(code){
  const inputs = paperInputs();
  const data = inputs.map(el => el.type === "radio" ? (el.checked ? 1 : 0) : el.value);
  try {
    localStorage.setItem("insp-"+code, JSON.stringify(data));
    showToast(`บันทึกแบบตรวจสอบ ${code} แล้ว`);
  } catch(e){
    showToast("ไม่สามารถบันทึกได้ในเบราว์เซอร์นี้");
  }
};
function loadInspectionForm(code){
  let raw;
  try { raw = localStorage.getItem("insp-"+code); } catch(e){ return; }
  if (!raw) return;
  let data;
  try { data = JSON.parse(raw); } catch(e){ return; }
  const inputs = paperInputs();
  inputs.forEach((el, i) => {
    if (i >= data.length) return;
    if (el.type === "radio") el.checked = !!data[i];
    else el.value = data[i];
  });
}

  { code:"SW-OH-3-076", title:"การบำรุงรักษา Load Break Switch",
    pre:["ตรวจสอบรายละเอียดของงาน และแผนที่ที่จะปฏิบัติงาน เพื่อความถูกต้องในการเตรียมงาน","วางแผนงาน ประสานงานศูนย์สั่งการฯ จัดทำ Switching เพื่อไม่ให้มีไฟฟ้าดับระหว่างการทดสอบระบบ ATS หากมีผู้ใช้ไฟฟ้าได้รับผลกระทบให้แจ้งนัดดับไฟฟ้าล่วงหน้า","วางแผนการเดินทาง","ตรวจสอบสถานที่และสภาพแวดล้อมในการปฏิบัติงาน","ตั้งป้ายสัญญาณเตือนและกั้นบริเวณให้ครอบคลุมพื้นที่ปฏิบัติงาน",WI_PPE_LINE,WI_LADDER_LINE,WI_POLE_LINE,"ตรวจสอบ Clamp On Meter",WI_KYT_LINE],
    work:["1. ตรวจสอบข้อมูลทั่วไปของ Load Break Switch","2. ตรวจสอบบำรุงรักษาสภาพทั่วไป ตามข้อกำหนด",
      "## สภาพ LBS และอุปกรณ์ประกอบ",
      "2.1 ตัวถัง LBS / สลักล็อคการปลดสับ : ตัวถังไม่ฉีกขาดหรือบวม/สลักล็อคทดสอบใช้งานได้","2.2 สถานะก๊าซ SF6 : มีก๊าซ SF6 อยู่ในเกณฑ์ ตรวจสอบได้จากตัวแสดงสถานะ","2.3 Bushing : ไม่มีรอยแตกร้าว/ชำรุด","2.4 กับดักฟ้าผ่า : ไม่ชำรุด","2.5 VT : ตัวถังไม่ฉีกขาด/บวม/น้ำมันไม่รั่วซึม","2.6 Drop Fuse ลง VT : อยู่ในสถานะสับ/ไม่ชำรุดเสียหาย","2.7 คอนสาย : ไม่เอียง/บิดเบี้ยว","2.8 สายควบคุม LBS : ไม่มีจุดชำรุด","2.9 อุปกรณ์ป้องกันสัตว์ : ไม่ชำรุด",
      "## ตู้ Control / FRTU / Ground (กรณีใช้บันไดขึ้นไปตรวจสอบ ต้องพิงบันไดให้ได้มุมที่เหมาะสม ตีนบันไดห่างจากที่พิงประมาณ 1/4 ของความยาวบันได และต้องมีคนจับยึดไว้)",
      "2.10 ไฟสถานะหน้าตู้ : หลอดไฟแสดงสถานะถูกต้อง","2.11 แหล่งจ่ายไฟฟ้า และสายควบคุม : มีแรงดันไฟฟ้าและสายควบคุมไม่ชำรุด","2.12 สภาพแบตเตอรี่หรือ Capacitor : ไม่มีรอยแตกร้าว บวม/ชำรุด","2.13 Ground HV (L/A, LBS) : มีต่อเข้ากับตัวถัง LBS และ L/A","2.14 Ground LV (ตู้ Control) : มีต่อเข้ากับตู้ Control ตามมาตรฐาน",
      "3. การทดสอบปลด-สับ (หากมีระบบ ATS ให้ดำเนินการตามข้อ 4)",
      "3.1 ประสานงานศูนย์สั่งการฯ ดำเนินการ Switching","3.2 LBS อยู่ในสถานะปลด ทดสอบการสับทาง Remote (ผ่านระบบ DMS)","3.3 เมื่อสับแล้ว ทดสอบการปลดทาง Remote (ผ่านระบบ DMS)","3.4 เมื่อปลดแล้ว ทดสอบการสับทาง Local (กดปุ่มหน้าตู้ Control)","3.5 เมื่อสับแล้ว ทดสอบการปลดทาง Local (กดปุ่มหน้าตู้ Control)","3.6 หากไม่ทำงานตามที่กำหนด ใช้ขอยาวปลด-สับที่ตัว LBS กลับคืนตามสถานะเดิม แล้วแจ้งหน่วยงานที่เกี่ยวข้องดำเนินการแก้ไข","3.7 Switching กลับสู่สถานะก่อนทำการทดสอบ",
      "4. การทดสอบ ATS (ถ้ามี)","4.1 กรณีสายป้อนสวิตช์ตก ATS ทำงาน ให้บันทึกข้อมูลภายในวงรอบการบำรุงรักษา เพื่อไม่ต้องทดสอบการปลดสับอีกครั้ง","4.2 กรณีในวงรอบการบำรุงรักษาหาก ATS ไม่ได้ปลด-สับ: ทดสอบโดยถอดสาย Sensor ด้านสายป้อนออกเพื่อจำลองเหตุ แล้วแต่ Function การทำงานของระบบ ATS — หากทำงานตามกำหนด บันทึกผลแล้ว Switching กลับตามสถานะเดิม — หากไม่ทำงานตามกำหนด ให้ซ่อมแซมหรือวางแผนซ่อมแซมต่อไป"]
  },

  { code:"SW-OH-3-078", title:"การบำรุงรักษา Ring Main Unit",
    pre:["ตรวจสอบรายละเอียดของงาน และแผนที่ที่จะปฏิบัติงาน เพื่อความถูกต้องในการเตรียมงาน","วางแผนงาน ในกรณีที่มีการทดสอบระบบ ATF ที่ RMU หากมีผู้ใช้ไฟฟ้าได้รับผลกระทบจากการทดสอบให้แจ้งนัดดับไฟฟ้าล่วงหน้า","วางแผนการเดินทาง","ตรวจสอบสถานที่และสภาพแวดล้อมในการปฏิบัติงาน","ตั้งป้ายสัญญาณเตือนและกั้นบริเวณให้ครอบคลุมพื้นที่ปฏิบัติงาน",WI_PPE_LINE,WI_LADDER_LINE,WI_POLE_LINE,"ตรวจสอบ Clamp On Meter",WI_KYT_LINE],

      "## ตู้ครอบ RMU (ถ้ามีกรณีติดตั้งนอกอาคาร)","2.1 สภาพภายนอก : สะอาด ไม่มีรอยแตก บุบ","2.2 ประตู : เปิด-ปิด ล็อคได้","2.3 ฐานตู้ : ไม่มีรอยแตกร้าวจนรับโครงสร้างไม่ได้",
      "## RMU","2.4 สภาพ RMU/ห้อง : ไม่มีรอยแตก บุบ/สะอาด","2.5 ก๊าซ SF6 : อยู่ในโซนที่กำหนด","2.6 ตัวแสดงสถานะสวิตช์ : อยู่ในตำแหน่งที่ถูกต้อง","2.7 กุญแจล็อคป้องกันการปลด-สับ : ไม่ชำรุด (ใช้กรณีต้องการป้องกันการปลดสับจากบุคคลภายนอก)","2.8 คันสับ : มีและสามารถใช้ปลดสับได้","2.9 ตัวตรวจสอบแรงดัน : หลอดไฟหรือสัญลักษณ์แสดงสถานะถูกต้องหรือวัดแรงดันได้","2.10 ตัวตรวจสอบการลัดวงจร : ไม่ชำรุด",
      "## ระบบการปลด-สับด้วยไฟฟ้า (ถ้ามี)","2.11 แรงดันไฟฟ้าเลี้ยงอุปกรณ์ : จ่ายแรงดันตามกำหนด","2.12 สภาพแบตเตอรี่หรือ UPS (ถ้ามี) : ไม่บวมแตกและจ่ายแรงดันตามกำหนด","2.13 FRTU (ถ้ามี) : ไม่แตกร้าว/มีไฟฟ้าเลี้ยง/สัญญาณไฟฟ้าติดครบ","2.14 อุปกรณ์ควบคุมอื่นๆ : ไม่ชำรุด",
      "## ระบบ ATF ที่ RMU (ถ้ามี)","2.15 แรงดันไฟฟ้าเลี้ยงอุปกรณ์ : จ่ายแรงดันตามกำหนด",
      "3. การทดสอบปลด-สับ","3.1 กรณีมีการปลดสับสวิตช์ทำงาน ให้บันทึกข้อมูลภายในวงรอบการบำรุงรักษา เพื่อไม่ต้องทดสอบการปลดสับอีกครั้ง","3.2 กรณีในวงรอบการบำรุงรักษาหาก RMU ไม่ได้ปลดสับ: ทดสอบทาง REMOTE (ถ้ามี) — ทดสอบทาง Local (กดปุ่มหน้าตู้ Control ถ้ามี) — ทดสอบโดยใช้คันสับ",
      "4. การทดสอบระบบ ATF (ถ้ามี)","4.1 กรณีสายป้อนสวิตช์ตก ATF ทำงาน ให้บันทึกข้อมูลภายในวงรอบการบำรุงรักษา เพื่อไม่ต้องทดสอบการปลดสับอีกครั้ง","4.2 กรณีในวงรอบการบำรุงรักษาหาก ATF ไม่ได้ปลดสับ: ทดสอบโดยถอดสาย Sensor ด้านสายป้อนออกเพื่อจำลองเหตุ แล้วแต่ Function การทำงานของระบบ ATF — หากทำงานตามกำหนด บันทึกผลแล้ว Switching กลับตามสถานะเดิม — หากไม่ทำงานตามกำหนด ให้ซ่อมแซมหรือวางแผนซ่อมแซมต่อไป"]
  },
  { code:"SW-OH-3-079", title:"การบำรุงรักษา Unit Substation",
    pre:["ตรวจสอบรายละเอียดของงาน และแผนที่ที่จะปฏิบัติงาน เพื่อความถูกต้องในการเตรียมงาน","วางแผนงาน ในกรณีที่มีการทดสอบระบบ ATF ที่ RMU หากมีผู้ใช้ไฟฟ้าได้รับผลกระทบจากการทดสอบให้แจ้งนัดดับไฟฟ้าล่วงหน้า","วางแผนการเดินทาง","ตรวจสอบสถานที่และสภาพแวดล้อมในการปฏิบัติงาน","ตั้งป้ายสัญญาณเตือนและกั้นบริเวณให้ครอบคลุมพื้นที่ปฏิบัติงาน",WI_PPE_LINE,WI_LADDER_LINE,WI_POLE_LINE,"ตรวจสอบ Clamp On Meter",WI_KYT_LINE],
    work:["1. ตรวจสอบข้อมูลทั่วไปของ Unit Substation","2. ตรวจสอบบำรุงรักษาสภาพทั่วไป ตามข้อกำหนด",
      "## ตู้ครอบ RMU","2.1 สภาพภายนอก : สะอาด ไม่มีรอยแตก บุบ","2.2 ประตู : เปิด-ปิด ล็อคได้","2.3 ฐานตู้/นั่งร้าน : ไม่มีรอยแตกร้าวจนรับโครงสร้างไม่ได้",
      "## RMU","2.4 สภาพ RMU/ห้อง : ไม่มีรอยแตก บุบ/สะอาด","2.5 ก๊าซ SF6 : อยู่ในโซนที่กำหนด","2.6 ตัวแสดงสถานะสวิทซ์ : อยู่ในตำแหน่งที่ถูกต้อง","2.7 กุญแจล็อคป้องกันการปลด-สับ : ไม่ชำรุด (ใช้กรณีต้องการป้องกันการปลดสับจากบุคคลภายนอก)","2.8 คันสับ : มีและสามารถใช้ปลดสับได้","2.9 ตัวตรวจสอบแรงดัน : หลอดไฟหรือสัญลักษณ์แสดงสถานะถูกต้องหรือวัดแรงดันได้","2.10 ตัวตรวจสอบการลัดวงจร : ไม่ชำรุด",
      "## ระบบการปลด-สับด้วยไฟฟ้า (ถ้ามี)","2.11 แรงดันไฟฟ้าเลี้ยงอุปกรณ์ : จ่ายแรงดันตามกำหนด","2.12 สภาพแบตเตอรี่หรือ UPS (ถ้ามี) : ไม่บวมแตกและจ่ายแรงดันตามกำหนด","2.13 FRTU (ถ้ามี) : ไม่แตกร้าว/มีไฟฟ้าเลี้ยง/สัญญาณไฟฟ้าติดครบ","2.14 อุปกรณ์ควบคุมอื่นๆ : ไม่ชำรุด",
      "## ระบบ ATF ที่ RMU (ถ้ามี)","2.15 แรงดันไฟฟ้าเลี้ยงอุปกรณ์ : จ่ายแรงดันตามกำหนด",
      "## หม้อแปลง","2.16 ตัวถังหม้อแปลง : ตัวถังไม่ฉีกขาด/บวม/น้ำมันไม่รั่วซึม","2.17 Bushing HV-LV : ไม่มีรอยแตกร้าว/ชำรุด","2.18 สายหน้าหม้อแปลง HV-LV : ไม่มีจุดชำรุดรอยไหม้","2.19 L.V. Ground : มีต่อเข้ากับนิวทรัล","2.20 H.V. Ground : มีต่อเข้ากับตัวถังหม้อแปลง",
      "## อุปกรณ์ด้านแรงต่ำ","2.21 สภาพทั่วไป CB หรือ FUSE : ไม่มีรอยแตกร้าว/ชำรุด","2.22 สายไฟฟ้า : ไม่มีจุดชำรุดรอยไหม้","2.23 บัสบาร์ : ไม่ชำรุด","2.24 เครื่องวัดไฟฟ้า : อ่านค่าได้","2.25 CT-TLM Meter (ถ้ามี) : ไม่มีรอยแตกร้าว/ชำรุด","2.26 จุดร้อนแดงส่องด้วยกล้องเทอร์โมวิชั่น : ไม่มีจุดร้อนแดงเกินค่าที่กำหนด",
      "3. การวัดกระแสและแรงดันด้านแรงต่ำ","3.1 กรณีมีระบบ TLM ใช้งานได้ ให้ใช้ค่ากระแสและแรงดันไฟฟ้า ณ เวลาที่โหลดสูงสุด บันทึกลงในแบบตรวจสอบบำรุงรักษา Unit Substation","3.2 กรณีไม่มีระบบ TLM ที่จ่ายไฟฟ้าด้วยระบบสายใต้ดิน ให้จดค่ากระแสและแรงดันไฟฟ้าด้านแรงต่ำจาก Meter Panel",
      "4. การทดสอบปลด-สับ","4.1 กรณีมีการปลดสับสวิตช์ทำงาน ให้บันทึกข้อมูลภายในวงรอบการบำรุงรักษา เพื่อไม่ต้องทดสอบการปลดสับอีกครั้ง","4.2 กรณีในวงรอบการบำรุงรักษาหาก RMU ไม่ได้ปลดสับ: ทดสอบทาง REMOTE (ถ้ามี) — ทดสอบทาง Local (กดปุ่มหน้าตู้ Control ถ้ามี) — ทดสอบโดยใช้คันสับ",
      "5. การทดสอบระบบ ATF (ถ้ามี)","5.1 กรณีสายป้อนสวิตช์ตก ATF ทำงาน ให้บันทึกข้อมูลภายในวงรอบการบำรุงรักษา เพื่อไม่ต้องทดสอบการปลดสับอีกครั้ง","5.2 กรณีในวงรอบการบำรุงรักษาหาก ATF ไม่ได้ปลดสับ: ทดสอบโดยถอดสาย Sensor ด้านสายป้อนออกเพื่อจำลองเหตุ แล้วแต่ Function การทำงานของระบบ ATF — หากทำงานตามกำหนด บันทึกผลแล้ว Switching กลับตามสถานะเดิม — หากไม่ทำงานตามกำหนด ให้ซ่อมแซมหรือวางแผนซ่อมแซมต่อไป"]
  },
  { code:"SW-OH-3-080", title:"การบำรุงรักษา Capacitor Bank 12-24 kV ในสายป้อน",
    pre:["ตรวจสอบรายละเอียดของงาน และแผนที่ที่จะปฏิบัติงาน เพื่อความถูกต้องในการเตรียมงาน","วางแผนงานและการเดินทาง","ตรวจสอบสถานที่และสภาพแวดล้อมในการปฏิบัติงาน","ตั้งป้ายสัญญาณเตือนและกั้นบริเวณให้ครอบคลุมพื้นที่ปฏิบัติงาน",WI_PPE_LINE,WI_LADDER_LINE,WI_POLE_LINE,"ตรวจสอบ Clamp On Meter และเครื่องวัดค่าคาปาซิแตนซ์",WI_KYT_LINE],
    work:["1. ตรวจสอบข้อมูลทั่วไปของ Capacitor Bank 12-24 kV ในสายป้อน","2. ตรวจสอบบำรุงรักษาสภาพทั่วไป ตามข้อกำหนด",
      "## สภาพอุปกรณ์ประกอบ","2.1 Drop Fuse : ไม่มีรอยแตกร้าว/ชำรุด","2.2 Station Post Type Insulator : ไม่มีรอยแตกร้าว/ชำรุด","2.3 สายเข้า-ออก Drop Fuse : ไม่มีจุดชำรุดรอยไหม้","2.4 คอนสาย : ไม่เอียง/บิดเบี้ยว","2.5 อุปกรณ์ป้องกันสัตว์ : ไม่ชำรุด","2.6 กับดักฟ้าผ่า : ไม่มีรอยแตกร้าว/ชำรุด","2.7 ตัวถังหม้อแปลง : ตัวถังไม่ฉีกขาด/บวม/น้ำมันไม่รั่วซึม","2.8 Cover (Bushing, L/A, Term kit.) : ครอบจุดต่อสายได้สนิทสามารถป้องกันสัตว์ได้","2.9 H.V. Ground : มีต่อเข้ากับตัวถัง Capacitor และ L/A",
      "## อุปกรณ์ควบคุม (สำหรับสถานี Switching Capacitor Bank)","2.10 Vacuum CB : ไม่มีรอยแตกร้าว/ชำรุด","2.11 Supply : มีแรงดันตามที่กำหนด","2.12 Fuse Control ภายในตู้ : ไม่ขาด","2.13 หลอดไฟแสดงสถานะในตู้ : ติดแสดงสถานะถูกต้อง","2.14 หน้าจอ Digital Control : ติดแสดงค่าถูกต้องเห็นชัดเจน","2.15 เสียงนาฬิกาเดิน : ทำงานถูกต้อง","2.16 อุปกรณ์ทั่วไปภายในตู้ : ไม่ชำรุด",
      "## Capacitor Cell","2.17 ตัวถังคาปาซิเตอร์ : ตัวถังไม่ฉีกขาด/บวม/น้ำมันไม่รั่วซึม","2.18 Bushing : ไม่มีรอยแตกร้าว/ชำรุด","2.19 Fuse ภายใน : ไม่ขาด",
      "3. การวัดค่าคาปาซิแตนซ์",
      "## 3.1 กรณี Fixed Capacitor","3.1.1 ติดต่อประสานงานศูนย์สั่งการฯ เพื่อหยุดการทำงานของรีโคลสซิ่งรีเลย์ (Off RR.) และขอปลด DF ลง Capacitor Bank","3.1.2 ปลด DF ทั้ง 3 เฟสด้วยโหลดบัสเตอร์และนำกระบอกฟิวส์ลง","3.1.3 ปลด Hot Line Clamp ทั้ง 3 เฟส (ปลดเฟสไกลมาใกล้) แล้วรอ 10 นาที ก่อนทำงาน","3.1.4 สวมถุงมือยางทับด้วยถุงมือหนัง คายประจุ Capacitor โดย By pass ลงกราวด์ทีละเฟสทั้ง 3 เฟส","3.1.5 วัดค่าคาปาซิแตนซ์ที่ Capacitor แต่ละตัว ค่าที่ได้ต้องอยู่ในค่า ± 10% ของ Nameplate ที่กำหนดไว้","3.1.6 หากค่าไม่ได้ตามที่กำหนด ให้วางแผนเปลี่ยน Capacitor ตัวที่ชำรุดต่อไป","3.1.7 เมื่อปกติทุกตัว ติดตั้ง Hot Line Clamp เข้ากับ Stirrup Clamp","3.1.8 นำกระบอกฟิวส์ไปแขวนที่ DF แล้วสับเข้าจากเฟสใกล้ไปหาไกล","3.1.9 แจ้งศูนย์สั่งการฯ เพื่อให้รีโคลสซิ่งรีเลย์ทำงาน (On RR.)",
      "## 3.2 กรณี Switching Capacitor","3.2.1 ติดต่อประสานงานศูนย์สั่งการฯ เพื่อหยุดการทำงานของรีโคลสซิ่งรีเลย์ (Off RR.) และขอปลด Vacuum CB ลง Capacitor Bank","3.2.2 ปลด Vacuum CB ลง Capacitor Bank","3.2.3 ปลด DF ทั้ง 3 เฟสและนำกระบอกฟิวส์ลง","3.2.4 ปลด Hot Line Clamp ทั้ง 3 เฟส (ปลดเฟสไกลมาใกล้) แล้วรอ 10 นาที ก่อนทำงาน","3.2.5 สวมถุงมือยางทับด้วยถุงมือหนัง คายประจุ Capacitor โดย By pass ลงกราวด์ทีละเฟสทั้ง 3 เฟส","3.2.6 วัดค่าคาปาซิแตนซ์ที่ Capacitor แต่ละตัว ค่าที่ได้ต้องอยู่ในค่า ± 10% ของ Nameplate ที่กำหนดไว้","3.2.7 หากค่าไม่ได้ตามที่กำหนด ให้วางแผนเปลี่ยน Capacitor ตัวที่ชำรุดต่อไป","3.2.8 เมื่อปกติทุกตัว ติดตั้ง Hot Line Clamp เข้ากับ Stirrup Clamp","3.2.9 นำกระบอกฟิวส์ไปแขวนที่ DF แล้วสับเข้าจากเฟสใกล้ไปหาไกล","3.2.10 สับ Vacuum CB ลง Capacitor Bank","3.2.11 แจ้งศูนย์สั่งการฯ เพื่อให้รีโคลสซิ่งรีเลย์ทำงาน (On RR.)"]
  },
  { code:"SW-OH-3-081", title:"การบำรุงรักษาเครื่องป้องกันหม้อแปลงวงจรตาข่าย",
    pre:["ตรวจสอบรายละเอียดของงาน และแผนที่ที่จะปฏิบัติงาน เพื่อความถูกต้องในการเตรียมงาน","วางแผนงานและการเดินทาง","ตรวจสอบสถานที่และสภาพแวดล้อมในการปฏิบัติงาน","ตั้งป้ายสัญญาณเตือนและกั้นบริเวณให้ครอบคลุมพื้นที่ปฏิบัติงาน",WI_PPE_LINE,WI_LADDER_LINE,WI_POLE_LINE,"ตรวจสอบ Clamp On Meter",WI_KYT_LINE],
    work:["1. ตรวจสอบข้อมูลทั่วไปของเครื่องป้องกันหม้อแปลงวงจรตาข่าย","2. ตรวจสอบบำรุงรักษาสภาพภายนอก ตามข้อกำหนด",
      "2.1 สถานะ MV.SW. : อยู่ในสถานะ CLOSE","2.2 สถานะ NP : อยู่ในสถานะ CLOSE","2.3 เบอร์ตู้/สีตู้ : ชัดเจน ไม่ลอก","2.4 ระบบกราวด์ : มีทั้งกราวด์ N และ G","2.5 อุปกรณ์ป้องกันแรงดันเกินภายนอก : มีทั้งด้าน N และ T ไม่ชำรุด","2.6 ตัวถัง รอยต่อหม้อแปลง : ไม่เสียหาย/ไม่มีน้ำมันรั่วซึม","2.7 ฝาตู้ : ปิดแน่นสนิท","2.8 การแขวนป้ายแดงห้ามปลด-สับ : ให้ตรวจสอบว่ามีหรือไม่",
      "3. ทดสอบโดยปลด-สับ MV.SW.","3.1 ใช้ขอยาวปลด MV.SW. ครั้งที่ 1 : สถานะ NP ต้องเปลี่ยนจาก CLOSE เป็น OPEN","3.2 ใช้ขอยาวสับ MV.SW. ครั้งที่ 1 : สถานะ NP ต้องเปลี่ยนจาก OPEN เป็น CLOSE","3.3 ใช้ขอยาวปลด MV.SW. ครั้งที่ 2 : สถานะ NP ต้องเปลี่ยนจาก CLOSE เป็น OPEN","3.4 หากสถานะไม่เปลี่ยนตามที่กำหนด ให้ปลด MV.SW. แล้วขึ้นไปเปิดฝาตู้เพื่อตรวจสอบซ่อมแซมอุปกรณ์ต่อไป",
      "4. ตรวจสอบสภาพภายในตู้","4.1 ตรวจสอบสภาพอุปกรณ์ภายใน : ไม่มีน้ำหรือหยดน้ำเกาะ/อุปกรณ์ไม่ชำรุดเสียหาย","4.2 ตรวจสอบสภาพรีเลย์ : อยู่ในสถานะที่ถูกต้อง",
      "5. ตรวจสอบอุปกรณ์ส่งข้อมูลระยะไกล","5.1 ตู้อุปกรณ์ : ไม่ชำรุดเสียหาย","5.2 ไฟเลี้ยง/CB & FUSE : มีไฟเลี้ยง/CB&FUSE สับอยู่","5.3 อินเตอร์เน็ตสวิทซ์ : ไม่ชำรุดเสียหาย",
      "6. สับ SW.แรงกลาง เมื่อลงจากเสาแล้ว : สถานะ NP ต้องเปลี่ยนจาก OPEN เป็น CLOSE"]

function renderWorkInstruction(wi){
  const objective = wi.objective || WI_OBJECTIVE_DEFAULT;
  const post = wi.post || WI_POST_DEFAULT;
  const note = wi.note === null ? null : (wi.note || WI_NOTE_DEFAULT);
  const workHtml = wi.work.map(line => line.startsWith("## ")
    ? `<div class="wi-subhead">${line.slice(3)}</div>`
    : `<div class="wi-line">${line}</div>`
  ).join("");
  return `
    <div class="wi-doc-head">
      <div class="wi-kicker">เอกสารควบคุม</div>
      <div class="wi-kicker">เรื่อง</div>
      <div class="wi-doc-title">${wi.title}</div>
      <div class="wi-doc-code">รหัสเอกสาร ${wi.code}</div>
    </div>
    <div class="wi-section-title">วัตถุประสงค์</div>
    <ol class="wi-ol">${objective.map(o=>`<li>${o}</li>`).join("")}</ol>
    <div class="wi-section-title">ขั้นตอนก่อนปฏิบัติงาน</div>
    <ol class="wi-ol">${wi.pre.map(p=>`<li>${p}</li>`).join("")}</ol>
    <div class="wi-section-title">ขั้นตอนการปฏิบัติงาน</div>
    <div class="wi-work">${workHtml}</div>
    <div class="wi-section-title">ขั้นตอนหลังการปฏิบัติงาน</div>
    <ol class="wi-ol">${post.map(p=>`<li>${p}</li>`).join("")}</ol>
    ${note ? `<div class="wi-note">หมายเหตุ ${note}</div>` : ""}
    <div class="paper-doc-footer"><span>พิมพ์ครั้งที่ 1</span><span>${wi.code}</span></div>
    <div class="insp-actions" style="border:none; padding:14px 0 0;">
      <button class="btn" onclick="window.print()">${ic('download')} พิมพ์คู่มือ</button>
    </div>
  `;
}

function renderInspectionDetail(f){
  if (f.kind === "oil") return renderOilForm(f);
  if (f.kind === "hotspot") return renderHotspotForm(f);
  if (f.kind === "pd") return renderPdForm(f);
  return renderChecklistForm(f);
}

function renderInspectionList(){
  const root = document.getElementById("inspectionRoot");
  if (!root) return;
  root.innerHTML = `<div class="insp-grid">` + INSPECTION_FORMS.map((f,i) => `
    <div class="card insp-card" onclick="openInspectionForm(${i})">
      <div class="ic">${ic(f.icon || "checklist")}</div>
      <div class="code">${f.code}</div>
      <div class="t">${f.title}</div>
      <div class="d">${f.equip}</div>
    </div>`).join("") + `</div>`;
}
window.openInspectionForm = function(idx, tab){
  tab = tab || "form";
  const f = INSPECTION_FORMS[idx];
  const wi = WORK_INSTRUCTIONS[idx];
  const root = document.getElementById("inspectionRoot");
  if (!root || !f) return;
  const body = (tab === "wi" && wi) ? renderWorkInstruction(wi) : renderInspectionDetail(f);
  root.innerHTML = `
    <div class="back-link" onclick="renderInspectionList()">${ic('arrowLeft')} กลับไปยังรายการแบบฟอร์ม</div>
    <div class="insp-tabs">
      <div class="insp-tab ${tab==="form"?"active":""}" onclick="openInspectionForm(${idx},'form')">แบบตรวจสอบ (SF-07)</div>
      ${wi ? `<div class="insp-tab ${tab==="wi"?"active":""}" onclick="openInspectionForm(${idx},'wi')">คู่มือการปฏิบัติงาน (SW-OH)</div>` : ""}
    </div>
    <div class="paper-sheet"><div class="paper-wrap">${body}</div></div>
  `;
  if (tab === "form") loadInspectionForm(f.code);
  window.scrollTo({top:0, behavior:"instant"});
};
window.renderInspectionList = renderInspectionList;

/* ===================== CHARTS (plain inline SVG — no library, no network) ===================== */
// Every chart is hand-drawn as SVG in plain JS. This removes the whole class of
// "chart library failed to load" problems (blocked CDN, offline, stale cache) —
// there is nothing to fetch and nothing that can fail to load.
const GRID = "#e4e8f0", MUTED = "#8992a3";

function svgBarChart(id, labels, values, color){
  const el = document.getElementById(id);
  if (!el) return;
  const w = el.clientWidth || 560, h = el.clientHeight || 220;
  if (!w || !h) return;
  const padL = 34, padR = 8, padT = 8, padB = 22;
  const chartW = w - padL - padR, chartH = h - padT - padB;
  const max = 100;
  const n = values.length, gap = chartW / n, barW = gap * 0.5;
  let grid = "", bars = "";
  for (let s = 0; s <= 4; s++){
    const val = max * s / 4;
    const y = padT + chartH - (val / max) * chartH;
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="${GRID}" stroke-width="1"/>`;
    grid += `<text x="${padL-6}" y="${(y+3).toFixed(1)}" font-size="10" fill="${MUTED}" text-anchor="end">${val}%</text>`;
  }
  values.forEach((v,i) => {
    const bh = (v / max) * chartH;
    const x = padL + i * gap + (gap - barW) / 2;
    const y = padT + chartH - bh;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="${color}"/>`;
  });
  const xlabels = labels.map((l,i) => `<text x="${(padL+i*gap+gap/2).toFixed(1)}" y="${h-6}" font-size="10" fill="${MUTED}" text-anchor="middle">${l}</text>`).join("");
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">${grid}${bars}${xlabels}</svg>`;
}

function svgDonut(id, values, colors){
  const el = document.getElementById(id);
  if (!el) return;
  const size = Math.min(el.clientWidth || 168, el.clientHeight || 168) || 168;
  if (!size) return;
  const cx = size/2, cy = size/2, r = size*0.36, sw = size*0.16;
  const circ = 2 * Math.PI * r;
  const total = values.reduce((a,b)=>a+b,0) || 1;
  let offset = 0, segs = "";
  values.forEach((v,i) => {
    const dash = (v/total) * circ;
    segs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors[i]}" stroke-width="${sw}" stroke-dasharray="${dash.toFixed(2)} ${(circ-dash).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += dash;
  });
  el.innerHTML = `<svg viewBox="0 0 ${size} ${size}" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">${segs}</svg>`;
}

function svgStackedBar(id, labels, series){
  const el = document.getElementById(id);
  if (!el) return;
  const w = el.clientWidth || 560, h = 190;
  if (!w) return;
  const padL = 40, padR = 8, padT = 8, padB = 20;
  const chartW = w - padL - padR, chartH = h - padT - padB;
  const n = labels.length;
  const totals = labels.map((_,i) => series.reduce((a,s)=>a+s.data[i],0));
  const max = Math.max(...totals) * 1.15;
  const gap = chartW / n, barW = gap * 0.55;
  let grid = "", bars = "";
  for (let s = 0; s <= 4; s++){
    const val = max * s / 4;
    const y = padT + chartH - (val/max) * chartH;
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="${GRID}" stroke-width="1"/>`;
    grid += `<text x="${padL-6}" y="${(y+3).toFixed(1)}" font-size="9.5" fill="${MUTED}" text-anchor="end">${Math.round(val)}k</text>`;
  }
  for (let i = 0; i < n; i++){
    let yCursor = padT + chartH;
    const x = padL + i*gap + (gap-barW)/2;
    series.forEach(s => {
      const bh = (s.data[i] / max) * chartH;
      const y = yCursor - bh;
      bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" fill="${s.color}"/>`;
      yCursor = y;
    });
  }
  const xlabels = labels.map((l,i) => `<text x="${(padL+i*gap+gap/2).toFixed(1)}" y="${h-4}" font-size="9.5" fill="${MUTED}" text-anchor="middle">${l}</text>`).join("");
  const legend = `<div style="display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:4px;">` +
    series.map(s => `<span style="display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--text-soft);"><span style="width:8px; height:8px; border-radius:3px; background:${s.color}; display:inline-block;"></span>${s.name}</span>`).join("") +
    `</div>`;
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" xmlns="http://www.w3.org/2000/svg">${grid}${bars}${xlabels}</svg>${legend}`;
}
