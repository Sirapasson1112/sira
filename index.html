<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CMMS งาน PM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#E9EDEF;--surface:#FFFFFF;--ink:#13262E;--muted:#4F6069;--line:#C6D0D5;
  --pri:#0B5CAD;--pri-ink:#FFFFFF;--pri-soft:#DCEAF7;
  --acc:#C2410C;
  --ok:#1B7A4B;--ok-soft:#DDF1E5;
  --warn:#8A5A00;--warn-soft:#FBEBC5;--amber:#D99A00;
  --bad:#B42318;--bad-soft:#FBE0DC;
  --head:'Prompt','IBM Plex Sans Thai','Noto Sans Thai',Tahoma,sans-serif;
  --body:'IBM Plex Sans Thai','Noto Sans Thai',Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1A20;--surface:#162830;--ink:#E5EEF2;--muted:#9BB0B9;--line:#2C424C;
    --pri:#63AEF2;--pri-ink:#08131A;--pri-soft:#173A55;
    --acc:#FF9A5C;
    --ok:#63D19A;--ok-soft:#173B2B;
    --warn:#F5C55A;--warn-soft:#3F3212;--amber:#F2B01E;
    --bad:#FF8B7D;--bad-soft:#462120;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1A20;--surface:#162830;--ink:#E5EEF2;--muted:#9BB0B9;--line:#2C424C;
  --pri:#63AEF2;--pri-ink:#08131A;--pri-soft:#173A55;
  --acc:#FF9A5C;
  --ok:#63D19A;--ok-soft:#173B2B;
  --warn:#F5C55A;--warn-soft:#3F3212;--amber:#F2B01E;
  --bad:#FF8B7D;--bad-soft:#462120;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--head);font-weight:600;margin:0;line-height:1.4}
h1{font-size:clamp(25px,4vw,34px)}
h2{font-size:20px;font-weight:500}
p{margin:0}
.muted,.sub{color:var(--muted)}
.sub{font-size:14px;line-height:1.5}
.lede{color:var(--muted);max-width:62ch;margin-top:6px}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1.5px solid var(--ink)}
.brand{display:flex;align-items:baseline;gap:12px;padding-top:12px}
.brand b{font-family:var(--head);font-size:20px;font-weight:600}
.brand span{font-size:14px;color:var(--muted)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{font:inherit;font-weight:500;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 14px 7px;cursor:pointer;white-space:nowrap;margin-bottom:-1.5px}
nav button:hover{color:var(--ink)}
nav button[aria-current="page"]{color:var(--ink);font-weight:600;border-bottom-color:var(--pri)}
.bdg{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--acc);color:var(--surface);font-size:12px;font-weight:600;text-align:center;line-height:20px}

main{padding:30px 0 40px;min-height:60vh}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}

/* buttons */
.btn{font:inherit;font-weight:500;padding:8px 16px;min-height:40px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:3px;cursor:pointer}
.btn:hover{background:var(--pri-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 12px;min-height:32px;font-size:14px}
.link{font:inherit;font-weight:600;background:none;border:0;padding:0;color:var(--pri);text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* the rail of tags on home */
.flow{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;padding-top:34px;margin:34px 0 12px}
.flow::before{content:"";position:absolute;left:0;right:12px;top:0;height:3px;background:var(--ink)}
.flow::after{content:"";position:absolute;right:0;top:-5px;border-left:14px solid var(--ink);border-top:6.5px solid transparent;border-bottom:6.5px solid transparent}
.st{position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--ink);border-radius:4px;padding:26px 14px 14px;cursor:pointer}
.st::before{content:"";position:absolute;left:50%;top:-34px;width:2px;height:34px;background:var(--ink);transform:translateX(-1px)}
.st::after{content:"";position:absolute;left:50%;top:9px;width:10px;height:10px;border:1.5px solid var(--ink);border-radius:50%;background:var(--bg);transform:translateX(-50%)}
.st:hover{background:var(--pri-soft)}
.stn{font-size:13px;color:var(--muted)}
.stname{font-family:var(--head);font-weight:600;font-size:18px;line-height:1.4}
.stdesc{font-size:14px;color:var(--muted);line-height:1.5;min-height:3em}
.stval{font-family:var(--head);font-weight:600;font-size:28px;line-height:1.3;margin-top:10px}
.stu{font-size:13px;color:var(--muted);line-height:1.4}
.stwarn{font-size:13px;font-weight:600;color:var(--acc);margin-top:4px}
.loop{color:var(--muted);font-size:15px;margin:0 0 30px}

/* ledger */
.ledger{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:0 0 34px;border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.ledger>div{padding:14px 16px}
.ledger>div+div{border-left:1px solid var(--line)}
.ledger dt{font-size:14px;color:var(--muted);line-height:1.5}
.ledger dd{margin:2px 0 0;font-family:var(--head);font-weight:600;font-size:30px;line-height:1.35}
.ledger small{display:block;font-size:13px;color:var(--muted);line-height:1.5}
.ledger .low{color:var(--bad)}
.ledger .good{color:var(--ok)}

/* sections & rows */
.sec{margin-top:8px}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.rows{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.rows li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.rn{font-weight:600}
.empty{padding:22px 0;border-top:2px solid var(--ink);color:var(--muted)}
.t-bad{color:var(--bad);font-weight:600}
.t-warn{color:var(--warn);font-weight:600}
.pill{display:inline-block;padding:1px 10px;border-radius:3px;font-size:13px;font-weight:600;line-height:1.7;white-space:nowrap}
.pill.wait{border:1px solid var(--muted);color:var(--muted)}
.pill.doing{background:var(--pri-soft);color:var(--pri)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.off{border:1px dashed var(--muted);color:var(--muted)}

/* tables */
.tw{overflow-x:auto;border-top:2px solid var(--ink);background:var(--surface);margin-bottom:34px}
table{width:100%;border-collapse:collapse;min-width:680px}
th{text-align:left;font-weight:600;font-size:14px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{font:inherit;font-weight:500;padding:5px 14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}

/* blocks (job plan, route) */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 44px}
.blk{border-top:2px solid var(--ink);padding:16px 0 26px}
.bh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px}
.tasks{margin:12px 0 0;padding-left:22px}
.tasks li{padding:1px 0}
.line{list-style:none;margin:14px 0 0;padding:0 0 0 28px;position:relative}
.line::before{content:"";position:absolute;left:5px;top:14px;bottom:14px;width:2px;background:var(--ink)}
.line li{position:relative;padding:6px 0;display:flex;flex-direction:column}
.line li::before{content:"";position:absolute;left:-28px;top:12px;width:8px;height:8px;border:2px solid var(--ink);border-radius:50%;background:var(--surface)}

/* chart */
.chart{border-top:2px solid var(--ink);padding-top:14px;margin-bottom:34px}
.chart svg{display:block;width:100%;height:auto;max-width:720px}
.chart text{font-family:inherit}
.defs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 44px;margin:0}
.defs dt{font-weight:600}
.defs dd{margin:0;color:var(--muted);font-size:15px;line-height:1.6}

/* dialog */
dialog{border:1.5px solid var(--ink);border-radius:4px;background:var(--surface);color:var(--ink);padding:0;width:min(94vw,620px);max-height:92vh;overflow:hidden}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(8,18,24,.6)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dh h2{font-size:18px}
.db{padding:16px 18px;overflow:auto;flex:1}
.df{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.sp{flex:1}
.fld{display:grid;gap:4px;margin-bottom:14px}
.fld[hidden]{display:none}
.fld label{font-weight:600;font-size:15px}
.fld small{color:var(--muted);font-size:13px}
input,select,textarea{font:inherit;width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink)}
input[readonly]{opacity:.7}
input[type=checkbox]{width:20px;height:20px;flex:none;margin:3px 0 0;accent-color:var(--pri)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
fieldset.grp{border:0;padding:0;margin:0 0 16px}
fieldset.grp legend{font-family:var(--head);font-weight:500;padding:0 0 4px}
.err{color:var(--bad);font-weight:600;min-height:1.5em;margin-top:6px}
.meta{display:flex;flex-wrap:wrap;gap:4px 22px;margin:0 0 14px;color:var(--muted);font-size:15px}
.stoprow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.stoprow .idx{font-family:var(--head);font-weight:600;color:var(--muted)}
.stoprow .ctl{grid-column:2;display:flex;flex-wrap:wrap;gap:6px}

footer{border-top:1px solid var(--line);padding:18px 0 40px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:3px;max-width:92vw;font-weight:500;z-index:50;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  .flow{grid-template-columns:1fr;gap:14px;padding:0 0 22px 36px;margin-top:26px}
  .flow::before{left:10px;right:auto;top:0;bottom:8px;width:3px;height:auto}
  .flow::after{left:3.5px;right:auto;top:auto;bottom:0;border-left:7.5px solid transparent;border-right:7.5px solid transparent;border-top:14px solid var(--ink);border-bottom:0}
  .st{padding:14px 14px 14px 30px}
  .st::before{left:-36px;top:26px;width:36px;height:2px;transform:none}
  .st::after{left:10px;top:21px;transform:none}
  .stdesc{min-height:0}
  .ledger{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ledger>div:nth-child(3){border-left:0}
  .ledger>div:nth-child(n+3){border-top:1px solid var(--line)}
  .grid2,.defs{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><b>CMMS งาน PM</b><span>ระบบบำรุงรักษาเชิงป้องกัน</span></div>
    <nav id="nav" aria-label="เมนูหลัก"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<footer>
  <div class="wrap">
    <span>ข้อมูลในหน้านี้เป็นตัวอย่าง เก็บไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น</span>
    <button class="btn sm" data-act="reset">รีเซ็ตเป็นข้อมูลตัวอย่าง</button>
  </div>
</footer>
<dialog id="dlg" aria-modal="true"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ---------- helpers ---------- */
const KEY='cmms-pm-demo-v1';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const today=()=>fmt(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const addMonths=(s,n)=>{const d=parse(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return fmt(d)};
const addEvery=(s,n,u)=>u==='เดือน'?addMonths(s,n):addDays(s,n*(u==='สัปดาห์'?7:1));
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/86400000);
const MONTHS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const dshort=s=>{const d=parse(s);return d.getDate()+' '+MONTHS[d.getMonth()]};
const dfull=s=>{const d=parse(s);return d.getDate()+' '+MONTHS[d.getMonth()]+' '+(d.getFullYear()+543)};
const monthKey=s=>s.slice(0,7);
const fmtH=n=>Number.isInteger(n)?String(n):n.toFixed(1);
function dueText(s){
  const n=diffDays(s,today());
  if(n<0)return{t:'เลยกำหนด '+(-n)+' วัน',c:'bad'};
  if(n===0)return{t:'ครบกำหนดวันนี้',c:'warn'};
  if(n<=7)return{t:'อีก '+n+' วัน',c:'warn'};
  return{t:'อีก '+n+' วัน',c:''};
}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function nextId(p,list,w){const m=list.reduce((a,x)=>Math.max(a,parseInt(String(x.id).split('-')[1],10)||0),0);return p+'-'+String(m+1).padStart(w,'0')}

const CRIT=[['A','A สำคัญมาก'],['B','B สำคัญปานกลาง'],['C','C ทั่วไป']];
const UNITS=[['วัน','วัน'],['สัปดาห์','สัปดาห์'],['เดือน','เดือน']];
const TARGET=90;

/* ---------- data ---------- */
let S;
function seed(){
  const T=today();
  const o={
    assets:[
      {id:'P-101',name:'ปั๊มน้ำหล่อเย็น 1',loc:'Utility',crit:'A'},
      {id:'P-102',name:'ปั๊มน้ำหล่อเย็น 2',loc:'Utility',crit:'A'},
      {id:'AC-201',name:'Air Compressor 1',loc:'Utility',crit:'A'},
      {id:'CH-601',name:'Chiller 1',loc:'Utility',crit:'A'},
      {id:'MX-401',name:'เครื่องผสม Mixer',loc:'ไลน์ผลิต',crit:'A'},
      {id:'CV-301',name:'สายพานลำเลียง Line 3',loc:'ไลน์ผลิต',crit:'B'},
      {id:'FN-501',name:'พัดลมระบายอากาศ',loc:'อาคารโรงงาน',crit:'C'}
    ],
    jobPlans:[
      {id:'JP-01',name:'ตรวจสภาพปั๊ม',craft:'ช่างกล',hrs:1,tasks:['ฟังเสียงและจับการสั่นผิดปกติ','ตรวจรอยรั่วที่ซีลและข้อต่อ','วัดกระแสมอเตอร์เทียบค่าบนป้ายเครื่อง','อัดจารบีแบริ่ง']},
      {id:'JP-02',name:'PM Air Compressor',craft:'ช่างกล',hrs:2,tasks:['ระบายน้ำในถังลม','เช็คระดับน้ำมันคอมเพรสเซอร์','ทำความสะอาดไส้กรองอากาศ','ตรวจความตึงสายพาน','ทดสอบ safety valve']},
      {id:'JP-03',name:'PM สายพานลำเลียง',craft:'ช่างกล',hrs:1.5,tasks:['เช็คความตึงและแนวสายพาน','หล่อลื่นลูกกลิ้ง','ตรวจ guard ครอบส่วนหมุน','ทดสอบปุ่ม emergency stop']},
      {id:'JP-04',name:'PM เครื่องผสม',craft:'ช่างกล',hrs:2.5,tasks:['เช็คระดับน้ำมันเกียร์','ตรวจซีลเพลาใบพาย','ขันแน่นน็อตฐานเครื่อง','ตรวจสภาพใบพาย','ทดสอบปุ่มหยุดฉุกเฉินและ interlock']},
      {id:'JP-05',name:'PM Chiller',craft:'ช่างเทคนิคทำความเย็น',hrs:3,tasks:['บันทึกความดันและอุณหภูมิน้ำเข้าออก','ตรวจระดับน้ำยาที่ sight glass','ทำความสะอาดคอนเดนเซอร์','ตรวจการทำงานของโหลดและ alarm']},
      {id:'JP-06',name:'ตรวจพัดลมและมอเตอร์',craft:'ช่างไฟฟ้า',hrs:1,tasks:['ตรวจใบพัดและการสั่น','ตรวจสายไฟและขั้วต่อ','วัดอุณหภูมิมอเตอร์','เช็คสายพานหรือคัปปลิ้ง']}
    ],
    routes:[
      {id:'RT-01',name:'เดินตรวจ Utility',stops:[{a:'P-101',j:'JP-01'},{a:'P-102',j:'JP-01'},{a:'AC-201',j:'JP-02'},{a:'CH-601',j:'JP-05'}]},
      {id:'RT-02',name:'เดินตรวจไลน์ผลิต',stops:[{a:'MX-401',j:'JP-04'},{a:'CV-301',j:'JP-03'},{a:'FN-501',j:'JP-06'}]}
    ],
    templates:[
      {id:'TP-01',name:'ตรวจปั๊มรายเดือน',jp:'JP-01',every:1,unit:'เดือน'},
      {id:'TP-02',name:'PM คอมเพรสเซอร์รายไตรมาส',jp:'JP-02',every:3,unit:'เดือน'},
      {id:'TP-03',name:'PM สายพานรายสัปดาห์',jp:'JP-03',every:1,unit:'สัปดาห์'}
    ],
    pms:[],wos:[]
  };
  S=o;
  const P=(id,name,kind,ref,asset,every,unit,dn,dl,tpl)=>({id,name,kind,ref,asset,every,unit,next:addDays(T,dn),last:dl==null?null:addDays(T,dl),active:true,tpl:tpl||null});
  o.pms=[
    P('PM-001','ตรวจสภาพปั๊ม P-101','jp','JP-01','P-101',1,'เดือน',-3,-33,'TP-01'),
    P('PM-002','ตรวจสภาพปั๊ม P-102','jp','JP-01','P-102',1,'เดือน',2,-28,'TP-01'),
    P('PM-003','PM Air Compressor 1','jp','JP-02','AC-201',3,'เดือน',12,-78,'TP-02'),
    P('PM-004','PM Chiller 1','jp','JP-05','CH-601',3,'เดือน',31,-60),
    P('PM-005','PM สายพาน Line 3','jp','JP-03','CV-301',1,'สัปดาห์',1,-6,'TP-03'),
    P('PM-006','PM เครื่องผสม','jp','JP-04','MX-401',1,'เดือน',-1,-31),
    P('PM-007','ตรวจพัดลมระบายอากาศ','jp','JP-06','FN-501',6,'เดือน',40,-140),
    P('PM-008','เดินตรวจ Utility ประจำสัปดาห์','route','RT-01',null,1,'สัปดาห์',3,-4),
    P('PM-009','เดินตรวจไลน์ผลิต','route','RT-02',null,2,'สัปดาห์',6,-8)
  ];
  /* ประวัติย้อนหลัง: ทำให้กราฟ KPI มีข้อมูล */
  const r=rng(2026),hist=[],now=new Date(),lateBy=[3,3,2,2,1];
  const pushHist=(due,late)=>{
    const pm=o.pms[Math.floor(r()*o.pms.length)];
    const plan=pmHours(pm);
    let done;
    if(late&&due<T)done=addDays(due,1+Math.floor(r()*5));else done=addDays(due,-Math.floor(r()*3));
    if(done>T)done=T;
    hist.push({id:'',pmId:pm.id,title:pm.name,due:due,created:addDays(due,-7),status:'done',done:done,hrs:Math.round(plan*(0.85+r()*0.5)*2)/2||0.5,plan:plan,steps:[],note:'',crit:pmCrit(pm),hist:true});
  };
  for(let m=5;m>=1;m--){
    const first=fmt(new Date(now.getFullYear(),now.getMonth()-m,1));
    for(let i=0;i<10;i++)pushHist(addDays(first,Math.floor(r()*27)),i<lateBy[5-m]);
  }
  const first=fmt(new Date(now.getFullYear(),now.getMonth(),1));
  const dom=now.getDate();
  for(let i=0;i<8;i++)pushHist(addDays(first,Math.floor(r()*dom)),i<1);
  hist.sort((a,b)=>a.due.localeCompare(b.due));
  hist.forEach((w,i)=>{w.id='WO-'+String(i+1).padStart(4,'0')});
  o.wos=hist;
  /* ใบสั่งงานที่เปิดอยู่ */
  const w1=makeWO(o.pms[0]);w1.created=addDays(T,-10);
  const w2=makeWO(o.pms[5]);w2.created=addDays(T,-8);w2.status='doing';
  w2.steps.slice(0,3).forEach(s=>{s.ok=true});
  return o;
}

const assetName=id=>{const a=S.assets.find(x=>x.id===id);return a?a.id+' '+a.name:String(id)};
const jpOf=id=>S.jobPlans.find(j=>j.id===id)||{id:id,name:'(ไม่พบ Job Plan)',tasks:[],hrs:0,craft:''};
const rtOf=id=>S.routes.find(r=>r.id===id)||{id:id,name:'(ไม่พบ Route)',stops:[]};
const pmAssets=pm=>pm.kind==='jp'?[pm.asset]:rtOf(pm.ref).stops.map(s=>s.a);
function pmHours(pm){return pm.kind==='jp'?jpOf(pm.ref).hrs:rtOf(pm.ref).stops.reduce((a,s)=>a+jpOf(s.j).hrs,0)}
function pmCrit(pm){
  const cs=pmAssets(pm).map(id=>{const a=S.assets.find(x=>x.id===id);return a?a.crit:'C'}).sort();
  return cs[0]||'C';
}
function openWOof(pmId){return S.wos.find(w=>w.pmId===pmId&&w.status!=='done')}
function makeWO(pm){
  const steps=[];
  if(pm.kind==='jp'){jpOf(pm.ref).tasks.forEach(t=>steps.push({a:pm.asset,t:t,ok:false}))}
  else{rtOf(pm.ref).stops.forEach(st=>jpOf(st.j).tasks.forEach(t=>steps.push({a:st.a,t:t,ok:false})))}
  const w={id:nextId('WO',S.wos,4),pmId:pm.id,title:pm.name,due:pm.next,created:today(),status:'wait',done:null,hrs:null,plan:pmHours(pm),steps:steps,note:'',crit:pmCrit(pm),hist:false};
  S.wos.push(w);
  return w;
}

/* ---------- KPI ---------- */
function compliance(filter){
  const T=today();let due=0,on=0;
  S.wos.forEach(w=>{
    if(w.due>T||!filter(w))return;
    due++;
    if(w.status==='done'&&w.done<=w.due)on++;
  });
  return{due:due,on:on,pct:due?Math.round(on/due*100):null};
}
function monthly(){
  const now=new Date(),out=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const key=d.getFullYear()+'-'+pad(d.getMonth()+1);
    out.push(Object.assign({key:key,label:MONTHS[d.getMonth()]},compliance(w=>monthKey(w.due)===key)));
  }
  return out;
}
function kpis(){
  const T=today();
  const cur=compliance(w=>monthKey(w.due)===monthKey(T));
  const open=S.wos.filter(w=>w.status!=='done');
  const doneW=S.wos.filter(w=>w.status==='done'&&w.hrs&&w.plan);
  const pl=doneW.reduce((a,w)=>a+w.plan,0);
  return{
    pct:cur.pct,due:cur.due,on:cur.on,
    overduePM:S.pms.filter(p=>p.active&&p.next<T).length,
    open:open.length,
    backlog:open.reduce((a,w)=>a+w.plan,0),
    ratio:pl?doneW.reduce((a,w)=>a+w.hrs,0)/pl:null
  };
}
function ledger(k){
  const gap=k.pct==null?'ยังไม่มีใบที่ถึงกำหนด':(k.pct>=TARGET?'ถึงเป้าแล้ว':'ต่ำกว่าเป้า '+(TARGET-k.pct)+' จุด');
  return '<dl class="ledger">'+
   '<div><dt>PM Compliance เดือนนี้</dt><dd class="'+(k.pct!=null&&k.pct<TARGET?'low':'good')+'">'+(k.pct==null?'-':k.pct+'%')+'</dd><small>เป้า '+TARGET+'% '+gap+'<br>ทันเวลา '+k.on+' จาก '+k.due+' ใบ</small></div>'+
   '<div><dt>PM เลยกำหนด</dt><dd class="'+(k.overduePM?'low':'')+'">'+k.overduePM+'</dd><small>รายการ PM ที่ผ่านวันครบกำหนดแล้ว ยังไม่ปิดงาน</small></div>'+
   '<div><dt>ใบสั่งงานที่ยังเปิด</dt><dd>'+k.open+'</dd><small>งานค้างตามแผน '+fmtH(k.backlog)+' ชั่วโมง</small></div>'+
   '<div><dt>ชั่วโมงจริง ÷ แผน</dt><dd>'+(k.ratio==null?'-':k.ratio.toFixed(2))+'</dd><small>1.00 คือประเมินเวลาตรงเป๊ะ</small></div>'+
  '</dl>';
}

function chartSVG(ms){
  const W=640,H=270,L=40,R=58,Tp=26,B=54,pw=W-L-R,ph=H-Tp-B,bw=pw/ms.length;
  const y=v=>Tp+ph*(1-v/100);
  const label='PM Compliance รายเดือน '+ms.map(m=>m.label+' '+(m.pct==null?'ไม่มีข้อมูล':m.pct+' เปอร์เซ็นต์')).join(' ')+' เป้า '+TARGET+' เปอร์เซ็นต์';
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(label)+'">';
  [0,25,50,75,100].forEach(g=>{s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(g)+'" y2="'+y(g)+'" stroke="var(--line)"/><text x="'+(L-8)+'" y="'+(y(g)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+g+'</text>'});
  ms.forEach((m,i)=>{
    const x=L+i*bw+bw*0.2,w=bw*0.6,cx=x+w/2;
    if(m.pct!=null){
      const c=m.pct>=TARGET?'var(--ok)':m.pct>=80?'var(--amber)':'var(--bad)';
      s+='<rect x="'+x+'" y="'+y(m.pct)+'" width="'+w+'" height="'+Math.max(1,ph*m.pct/100)+'" fill="'+c+'"/>';
      s+='<text x="'+cx+'" y="'+(y(m.pct)-6)+'" text-anchor="middle" font-size="14" font-weight="600" fill="var(--ink)">'+m.pct+'%</text>';
    }else s+='<text x="'+cx+'" y="'+(y(0)-6)+'" text-anchor="middle" font-size="13" fill="var(--muted)">-</text>';
    s+='<text x="'+cx+'" y="'+(H-B+20)+'" text-anchor="middle" font-size="13" fill="var(--ink)">'+m.label+'</text>';
    s+='<text x="'+cx+'" y="'+(H-B+37)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+m.due+' ใบ</text>';
  });
  s+='<line x1="'+L+'" x2="'+(W-R+6)+'" y1="'+y(TARGET)+'" y2="'+y(TARGET)+'" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="6 4"/>';
  s+='<text x="'+(W-R+10)+'" y="'+(y(TARGET)+4)+'" font-size="12" font-weight="600" fill="var(--ink)">เป้า '+TARGET+'%</text>';
  return s+'</svg>';
}

/* ---------- dialog & forms ---------- */
const dlg=$('#dlg');
function openDlg(html){
  dlg.oninput=null;dlg.onchange=null;
  dlg.innerHTML=html;
  if(!dlg.open)dlg.showModal();
  const first=dlg.querySelector('.db input:not([type=checkbox]):not([readonly]),.db select,.db textarea');
  if(first)first.focus();
}
function closeDlg(){if(dlg.open)dlg.close()}
dlg.addEventListener('close',()=>render());
const err=m=>{const e=$('#ferr');if(e)e.textContent=m};
let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3400)}

function formHTML(fields,v){
  return fields.map(f=>{
    const id='f_'+f.name,val=v[f.name]==null?'':v[f.name];let inp;
    if(f.type==='select')inp='<select id="'+id+'">'+f.opts.map(o=>'<option value="'+esc(o[0])+'"'+(String(o[0])===String(val)?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>';
    else if(f.type==='textarea')inp='<textarea id="'+id+'" rows="'+(f.rows||5)+'">'+esc(val)+'</textarea>';
    else inp='<input id="'+id+'" type="'+f.type+'" value="'+esc(val)+'"'+(f.step?' step="'+f.step+'"':'')+(f.min!=null?' min="'+f.min+'"':'')+(f.ro?' readonly':'')+'>';
    return '<div class="fld" data-f="'+f.name+'"><label for="'+id+'">'+esc(f.label)+'</label>'+inp+(f.hint?'<small>'+esc(f.hint)+'</small>':'')+'</div>';
  }).join('');
}
const readForm=F=>{const o={};F.forEach(f=>{const el=$('#f_'+f.name);o[f.name]=el?el.value:''});return o};
function syncWhen(F){const v=readForm(F);F.forEach(f=>{if(f.when){const w=$('.fld[data-f="'+f.name+'"]');if(w)w.hidden=!f.when(v)}})}
function armDelete(btn,fn){
  let armed=false;
  btn.onclick=()=>{
    if(!armed){armed=true;btn.textContent='กดอีกครั้งเพื่อยืนยันลบ';return}
    const e=fn();
    if(e){armed=false;btn.textContent='ลบ';err(e);return}
    closeDlg();
  };
}
function openForm(o){
  const F=o.fields;
  openDlg('<div class="dh"><h2>'+esc(o.title)+'</h2><button class="btn sm" data-act="closeDlg">ปิด</button></div>'+
    '<div class="db">'+formHTML(F,o.values||{})+'<p class="err" id="ferr" role="alert"></p></div>'+
    '<div class="df">'+(o.onDelete?'<button class="btn danger" id="fdel">ลบ</button>':'')+'<span class="sp"></span><button class="btn" data-act="closeDlg">ยกเลิก</button><button class="btn pri" id="fsave">บันทึก</button></div>');
  syncWhen(F);
  dlg.oninput=dlg.onchange=()=>syncWhen(F);
  $('#fsave').onclick=()=>{
    const v=readForm(F);
    for(const f of F){
      if(f.req&&(!f.when||f.when(v))&&!String(v[f.name]).trim())return err('กรอก "'+f.label+'" ก่อนนะ');
    }
    const e=o.onSave(v);
    if(e)return err(e);
    closeDlg();
  };
  if(o.onDelete)armDelete($('#fdel'),o.onDelete);
}

    '<div class="db"><p class="muted" style="margin-bottom:10px">'+esc(jp.name)+' ทุก '+t.every+' '+esc(t.unit)+' เลือกเครื่องที่จะใช้ ระบบสร้าง PM แยกให้ทีละเครื่อง</p>'+
    (S.assets.length?S.assets.map(a=>'<label class="chk"><input type="checkbox" value="'+esc(a.id)+'"'+(has.has(a.id)?' disabled':'')+'><span>'+esc(a.id+' '+a.name)+(has.has(a.id)?' <span class="sub">มี PM จาก Template นี้แล้ว</span>':'')+'</span></label>').join(''):'<p class="muted">ยังไม่มีเครื่องจักร</p>')+
    '<div class="fld" style="margin-top:16px"><label for="tp_date">ครบกำหนดครั้งแรก</label><input id="tp_date" type="date" value="'+addDays(today(),7)+'"></div><p class="err" id="ferr" role="alert"></p></div>'+
    '<div class="df"><span class="sp"></span><button class="btn" data-act="closeDlg">ยกเลิก</button><button class="btn pri" id="tp_go">สร้าง PM</button></div>');
  $('#tp_go').onclick=()=>{
    const ids=Array.from(dlg.querySelectorAll('.db input[type=checkbox]:checked')).map(c=>c.value);
    const d=$('#tp_date').value;
    if(!ids.length)return err('เลือกเครื่องอย่างน้อย 1 เครื่อง');
    if(!d)return err('เลือกวันครบกำหนดครั้งแรกก่อนนะ');
    ids.forEach(aid=>S.pms.push({id:nextId('PM',S.pms,3),name:jp.name+' '+aid,kind:'jp',ref:t.jp,asset:aid,every:t.every,unit:t.unit,next:d,last:null,active:true,tpl:t.id}));
    save();toast('สร้าง PM '+ids.length+' รายการจาก Template แล้ว');closeDlg();
  };
}

/* pm */
function pmForm(id){
  const p=id?S.pms.find(x=>x.id===id):null,T=today();
  openForm({
    title:p?'แก้ไข '+p.id:'เพิ่ม PM',
    fields:[
      {name:'kind',label:'PM นี้ทำแบบไหน',type:'select',opts:[['jp','เครื่องเดียว ใช้ Job Plan'],['route','เดินตรวจหลายเครื่อง ใช้ Route']]},
      {name:'asset',label:'เครื่องจักร',type:'select',opts:S.assets.map(a=>[a.id,a.id+' '+a.name]),when:v=>v.kind==='jp'},
      {name:'ref_jp',label:'Job Plan',type:'select',opts:S.jobPlans.map(j=>[j.id,j.id+' '+j.name]),when:v=>v.kind==='jp'},
      {name:'ref_rt',label:'Route',type:'select',opts:S.routes.map(r=>[r.id,r.id+' '+r.name]),when:v=>v.kind==='route'},
      {name:'name',label:'ชื่อ PM',type:'text',hint:'ถ้าเว้นไว้ ระบบตั้งชื่อให้'},
      {name:'every',label:'ทำทุก',type:'number',min:1,step:1,req:true},
      {name:'unit',label:'หน่วย',type:'select',opts:UNITS},
      {name:'next',label:'ครบกำหนดครั้งถัดไป',type:'date',req:true},
      {name:'active',label:'สถานะ',type:'select',opts:[['1','เปิดใช้งาน'],['0','หยุดชั่วคราว']]}
    ],
    values:p?{kind:p.kind,asset:p.asset,ref_jp:p.kind==='jp'?p.ref:'',ref_rt:p.kind==='route'?p.ref:'',name:p.name,every:p.every,unit:p.unit,next:p.next,active:p.active?'1':'0'}:{kind:'jp',every:1,unit:'เดือน',next:addDays(T,7),active:'1'},
    onSave(v){
      const every=parseInt(v.every,10);
      if(!(every>=1))return 'ความถี่ต้องเป็นตัวเลข 1 ขึ้นไป';
      let ref,asset=null;
      if(v.kind==='jp'){
        if(!v.asset||!v.ref_jp)return 'ยังไม่มีเครื่องจักรหรือ Job Plan ให้เลือก ไปเพิ่มก่อนนะ';
        ref=v.ref_jp;asset=v.asset;
      }else{
        if(!v.ref_rt)return 'ยังไม่มี Route ให้เลือก ไปเพิ่มที่หน้า Route ก่อนนะ';
        ref=v.ref_rt;
      }
      const name=v.name.trim()||(v.kind==='jp'?jpOf(ref).name+' '+asset:rtOf(ref).name);
      const o={name:name,kind:v.kind,ref:ref,asset:asset,every:every,unit:v.unit,next:v.next,active:v.active==='1'};
      if(p)Object.assign(p,o);else S.pms.push(Object.assign({id:nextId('PM',S.pms,3),last:null,tpl:null},o));
      save();toast('บันทึก PM แล้ว');
    },
    onDelete:p?function(){
      if(openWOof(p.id))return 'ลบไม่ได้ เพราะมีใบสั่งงานที่ยังเปิดอยู่ ปิดงานก่อนนะ หรือเลือก "หยุดชั่วคราว" แทน';
      S.pms=S.pms.filter(x=>x!==p);save();toast('ลบ PM แล้ว');
    }:null
  });
}

/* work order */
function openWO(id){
  const w=S.wos.find(x=>x.id===id);if(!w)return;
  const pm=S.pms.find(p=>p.id===w.pmId),isDone=w.status==='done',groups=[];
  w.steps.forEach((s,i)=>{let g=groups.find(x=>x.a===s.a);if(!g){g={a:s.a,items:[]};groups.push(g)}g.items.push({s:s,i:i})});
  const body=w.steps.length?groups.map(g=>'<fieldset class="grp"><legend>'+esc(assetName(g.a))+'</legend>'+g.items.map(x=>'<label class="chk"><input type="checkbox" data-step="'+x.i+'"'+(x.s.ok?' checked':'')+(isDone?' disabled':'')+'><span>'+esc(x.s.t)+'</span></label>').join('')+'</fieldset>').join(''):'<p class="muted">ใบนี้เป็นข้อมูลย้อนหลัง ไม่มีรายการตรวจแยกข้อ</p>';
  const meta='<div class="meta"><span>ครบกำหนด '+dfull(w.due)+'</span><span>ตามแผน '+fmtH(w.plan)+' ชั่วโมง</span>'+(isDone?'<span>ปิดเมื่อ '+dfull(w.done)+' ใช้จริง '+fmtH(w.hrs)+' ชั่วโมง</span>':'')+'</div>';
  const foot=isDone?(w.note?'<p><b>หมายเหตุจากช่าง</b><br>'+esc(w.note)+'</p>':'')
    :'<div class="fld" style="margin-top:6px"><label for="wo_h">ชั่วโมงที่ใช้จริง</label><input id="wo_h" type="number" step="0.5" min="0.5" value="'+w.plan+'"></div><div class="fld"><label for="wo_n">หมายเหตุ</label><textarea id="wo_n" rows="2">'+esc(w.note)+'</textarea></div>';
  openDlg('<div class="dh"><div><h2>'+esc(w.id)+' '+esc(w.title)+'</h2></div><span id="wpill"></span></div>'+
    '<div class="db">'+meta+(w.steps.length&&!isDone?'<p class="sub" id="wprog" style="margin-bottom:8px"></p>':'')+body+foot+'<p class="err" id="ferr" role="alert"></p></div>'+
    '<div class="df">'+(isDone?'':'<button class="btn" id="wo_start">เริ่มงาน</button>')+'<span class="sp"></span><button class="btn" data-act="closeDlg">ปิดหน้าต่าง</button>'+(isDone?'':'<button class="btn pri" id="wo_close">ปิดงาน</button>')+'</div>');
  const refresh=()=>{
    $('#wpill').innerHTML=statusPill(w);
    const pr=$('#wprog');if(pr)pr.textContent='ติ๊กแล้ว '+w.steps.filter(s=>s.ok).length+' จาก '+w.steps.length+' ข้อ';
    const st=$('#wo_start');if(st)st.hidden=w.status!=='wait';
  };
  refresh();
  if(isDone)return;
  dlg.onchange=e=>{
    const c=e.target.closest('[data-step]');if(!c)return;
    w.steps[+c.dataset.step].ok=c.checked;
    if(w.status==='wait')w.status='doing';
    save();refresh();err('');
  };
  $('#wo_start').onclick=()=>{w.status='doing';save();refresh()};
  $('#wo_close').onclick=()=>{
    const left=w.steps.filter(s=>!s.ok).length;
    if(left)return err('ยังติ๊กไม่ครบอีก '+left+' ข้อ');
    const h=parseFloat($('#wo_h').value);
    if(!(h>0))return err('ใส่ชั่วโมงที่ใช้จริงก่อนนะ');
    w.status='done';w.done=today();w.hrs=h;w.note=$('#wo_n').value.trim();
    let msg='ปิด '+w.id+' แล้ว';
    if(pm){pm.last=w.done;pm.next=addEvery(w.done,pm.every,pm.unit);msg+=' PM รอบถัดไปคือ '+dshort(pm.next)}
    save();closeDlg();toast(msg);
  };
}

/* ---------- actions ---------- */
const ACT={
  go(id,b){tab=id;if(b.dataset.filter)woFilter=b.dataset.filter;render();window.scrollTo(0,0)},
  closeDlg(){closeDlg()},
  filter(id){woFilter=id;render()},
  openWO(id){openWO(id)},
  genWO(id){
    const pm=S.pms.find(p=>p.id===id);if(!pm)return;
    const ex=openWOof(id);if(ex){openWO(ex.id);return}
    const w=makeWO(pm);save();render();toast('สร้างใบสั่งงาน '+w.id+' แล้ว');
  },
  runGen(){
    const lim=addDays(today(),7);let n=0;
    S.pms.forEach(p=>{if(p.active&&p.next<=lim&&!openWOof(p.id)){makeWO(p);n++}});
    save();render();
    toast(n?'สร้างใบสั่งงานใหม่ '+n+' ใบ':'ไม่มี PM ที่ต้องสร้างเพิ่ม ทุกรายการมีใบสั่งงานแล้ว');
  },
  addAsset(){assetForm()},editAsset(id){assetForm(id)},
  addJP(){jpForm()},editJP(id){jpForm(id)},
  addRoute(){routeForm()},editRoute(id){routeForm(id)},
  addPM(){pmForm()},editPM(id){pmForm(id)},
  addTpl(){tplForm()},editTpl(id){tplForm(id)},applyTpl(id){applyTpl(id)},
  stopAdd(){RTE.stops.push({a:(S.assets[0]||{}).id||'',j:(S.jobPlans[0]||{}).id||''});drawRoute()},
  stopDel(id,b){RTE.stops.splice(+b.dataset.i,1);drawRoute()},
  stopUp(id,b){const i=+b.dataset.i,s=RTE.stops;if(i>0){[s[i-1],s[i]]=[s[i],s[i-1]];drawRoute('[data-act="stopUp"][data-i="'+(i-1)+'"]')}},
  stopDown(id,b){const i=+b.dataset.i,s=RTE.stops;if(i<s.length-1){[s[i+1],s[i]]=[s[i],s[i+1]];drawRoute('[data-act="stopDown"][data-i="'+(i+1)+'"]')}},
  reset(id,b){
    if(!b.dataset.armed){b.dataset.armed='1';b.textContent='กดอีกครั้งเพื่อยืนยันรีเซ็ต';return}
    delete b.dataset.armed;b.textContent='รีเซ็ตเป็นข้อมูลตัวอย่าง';
    seed();save();tab='home';woFilter='open';render();window.scrollTo(0,0);toast('รีเซ็ตเป็นข้อมูลตัวอย่างแล้ว');
  }
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const f=ACT[b.dataset.act];if(f)f(b.dataset.id,b,e);
});

load();
render();
</script>
